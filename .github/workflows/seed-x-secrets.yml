name: Seed X credentials into Supabase (2026-08-02)

# One-time MANUAL job (user 2026-08-02, P-05). The four X_* API values live only in GitHub Secrets (used by
# the daily tweet jobs) — they are NOT in the local .env or the encrypted Supabase store, so nothing running
# on the laptop can read them. A workflow, however, HAS them in its own env at runtime, so it can encrypt
# them into the app_secrets store itself. After this runs, db_pool's bootstrap loads them into os.environ
# everywhere (local server + every Actions job), and `x_publish` works locally too.
#
# GitHub cron is BANNED in this repo (all scheduling is cron-job.org); this is workflow_dispatch only — run
# it by hand from the Actions tab, once.
#
# PREREQUISITE (one manual step): add an APP_SECRET_KEY GitHub Secret whose value is the EXACT contents of
# data/.web_users.key. That is the Fernet key the local process decrypts with, so the rows this job writes
# must be encrypted with the same key or they will not decrypt on the laptop. Without APP_SECRET_KEY the job
# fails fast (see the guard step) rather than writing rows encrypted with a throwaway key.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_SECRET_KEY:       ${{ secrets.APP_SECRET_KEY }}
      X_API_KEY:            ${{ secrets.X_API_KEY }}
      X_API_SECRET:         ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # Fail fast with a clear message if the key or the X values are missing — never write rows with a
      # mismatched key. Prints presence only, never the values themselves.
      - name: Check prerequisites (no values printed)
        run: |
          python - <<'PY'
          import os, sys
          missing = [k for k in ("APP_SECRET_KEY","SUPABASE_USER","SUPABASE_DB_PASSWORD",
                                 "X_API_KEY","X_API_SECRET","X_ACCESS_TOKEN","X_ACCESS_SECRET")
                     if not os.environ.get(k)]
          if missing:
              print("MISSING required secrets:", ", ".join(missing))
              print("Add them in Settings -> Secrets and variables -> Actions. "
                    "APP_SECRET_KEY must equal the contents of data/.web_users.key.")
              sys.exit(1)
          print("All required secrets present.")
          PY
      - name: Seed X_* into the encrypted app_secrets store
        run: python migrate_secrets_to_supabase.py
      - name: Verify they decrypt back (names only)
        run: python migrate_secrets_to_supabase.py --verify
