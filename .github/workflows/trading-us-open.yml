name: US Open

on:
  schedule:
    - cron: '30 14 * * 1-5'  # 14:30 UTC Monday-Friday (NYSE open)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py US_OPEN
        env:
          IG_API_KEY:            ${{ secrets.IG_API_KEY }}
          IG_USERNAME:           ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
          SLACK_WEEKLY:          ${{ secrets.SLACK_WEEKLY }}
