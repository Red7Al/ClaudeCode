name: US Open

on:
  schedule:
    - cron: '*/10 14-16 * * 1-5'  # Every 10 min, 14:00–16:59 UTC (once-per-day guard prevents re-runs)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Set to true to bypass the once-per-day guard (re-scan even if already ran today)'
        required: false
        default: 'false'
  push:
    paths:
      - 'us_open_trigger.txt'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py US_OPEN
        env:
          IG_API_KEY:            ${{ secrets.IG_API_KEY }}
          IG_USERNAME:           ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
          SLACK_WEEKLY:          ${{ secrets.SLACK_WEEKLY }}
          FORCE_RUN:             ${{ github.event.inputs.force_run || 'false' }}
