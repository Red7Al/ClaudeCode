name: Scanner Snapshot Publish

# Heavy Scanner compute runs on the Actions worker, never on the IONOS web process. Scheduling remains in
# cron-job.org (GitHub-native cron is banned); the admin Refresh button dispatches this workflow as well.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: 'Optional comma-separated markets to refresh; empty = full universe.'
        required: false
        default: ''
      refresh_id:
        description: 'Opaque refresh request id used for Supabase progress reporting.'
        required: false
        default: ''

concurrency:
  group: scanner-snapshot-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_USER:                    ${{ secrets.SUPABASE_USER }}
  SUPABASE_DB_PASSWORD:             ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_SCANNER_PUBLISH_KEY:     ${{ secrets.SUPABASE_SCANNER_PUBLISH_KEY }}
  # Temporary publication route while Supabase Storage is unavailable. These are the same SSH
  # connection values used by deploy_ionos.sh; the key must be stored as a multiline Actions secret.
  IONOS_HOST:                       ${{ secrets.IONOS_HOST }}
  IONOS_USER:                       ${{ secrets.IONOS_USER }}
  IONOS_DIR:                        ${{ secrets.IONOS_DIR }}
  IONOS_PORT:                       ${{ secrets.IONOS_PORT || '22' }}
  IONOS_SITE:                       ${{ secrets.IONOS_SITE || 'https://www.squeezescanner.cloud' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check publication prerequisites without printing values
        run: |
          python - <<'PY'
          import os, sys
          required = ("SUPABASE_USER", "SUPABASE_DB_PASSWORD", "SUPABASE_SCANNER_PUBLISH_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          print("Scanner publication prerequisites:", "present" if not missing else "missing " + ", ".join(missing))
          if missing:
              sys.exit(1)
          PY
      # Validate the temporary IONOS route before the expensive scan.  A bad directory secret previously
      # allowed a 33-minute build to finish before scp discovered that hvf_web/ did not exist remotely.
      - name: Check IONOS fallback destination
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${IONOS_HOST:-}" ] || missing+=(IONOS_HOST)
          [ -n "${IONOS_USER:-}" ] || missing+=(IONOS_USER)
          [ -n "${IONOS_DIR:-}" ] || missing+=(IONOS_DIR)
          [ -n "${IONOS_SSH_KEY:-}" ] || missing+=(IONOS_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "IONOS fallback is not configured; missing: ${missing[*]}" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ionos_snapshot_key"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${IONOS_USER}@${IONOS_HOST}" "test -d '$IONOS_DIR/hvf_web' && test -f '$IONOS_DIR/hvf_web/snapshot.json'"
      - name: Seed partial build from IONOS during Supabase Storage outage
        if: ${{ inputs.markets != '' }}
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ionos_snapshot_key"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${IONOS_USER}@${IONOS_HOST}" "cat '$IONOS_DIR/hvf_web/snapshot.json'" > hvf_web/snapshot.json
          python -c "import json; json.load(open('hvf_web/snapshot.json', encoding='utf-8'))"
      - name: Build, publish and read-verify immutable Scanner snapshot
        id: publish
        continue-on-error: true
        run: python publish_scanner_snapshot.py --build --markets "${{ inputs.markets }}" --source github-actions --refresh-id "${{ inputs.refresh_id || github.run_id }}"
        env:
          SCANNER_SNAPSHOT_SKIP_SUPABASE_PULL: ${{ inputs.markets != '' && '1' || '0' }}
      # Keep the built snapshot even when publication fails (2026-08-17). The scan is the expensive part
      # -- up to two hours of engine plus yfinance -- and publication is a separate, later step that can
      # fail on its own: Supabase Storage started returning HTTP 402 when the free-tier egress quota was
      # exhausted, so every run threw away a perfectly good snapshot at the last hurdle and the live site
      # stayed frozen on 12 August. With this, a failed publish still yields a downloadable artifact that
      # can be placed on the web host directly (hvf_web/server.py falls back to the local file whenever
      # the Storage pull raises), which decouples "can we scan" from "can we reach Storage".
      # if: always() so it runs on the failure path, which is the whole point.
      - name: Upload the built snapshot as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-snapshot
          path: hvf_web/snapshot.json
          if-no-files-found: warn
          retention-days: 7

      # Supabase Storage currently returns HTTP 402 after the scan has completed.  During that outage,
      # publish the same verified local candidate directly to IONOS, where the CGI web tier already has a
      # last-known-good local fallback.  The remote move is atomic, so a request can never observe a partial
      # JSON file.  This route is deliberately conditional: normal successful Supabase publications do not
      # touch IONOS, and a failed build (with no snapshot) cannot masquerade as a successful fallback.
      - name: Publish failed snapshot to IONOS fallback
        id: ionos_fallback
        if: steps.publish.outcome == 'failure' && hashFiles('hvf_web/snapshot.json') != ''
        continue-on-error: true
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${IONOS_HOST:-}" ] || missing+=(IONOS_HOST)
          [ -n "${IONOS_USER:-}" ] || missing+=(IONOS_USER)
          [ -n "${IONOS_DIR:-}" ] || missing+=(IONOS_DIR)
          [ -n "${IONOS_SSH_KEY:-}" ] || missing+=(IONOS_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "IONOS fallback is not configured; missing: ${missing[*]}" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ionos_snapshot_key"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh_opts=(-i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote="${IONOS_USER}@${IONOS_HOST}"
          target="${IONOS_DIR}/hvf_web/snapshot.json"
          tmp="${target}.tmp-${GITHUB_RUN_ID}"
          echo "Uploading the completed snapshot to IONOS fallback: ${remote}:${target}"
          # Modern scp defaults to SFTP, which can apply a different chroot from the shell used by SSH
          # on IONOS shared hosting. Stream over the already validated SSH route instead.
          ssh "${ssh_opts[@]}" "$remote" "umask 077; cat > '$tmp'" < hvf_web/snapshot.json
          ssh "${ssh_opts[@]}" "$remote" "set -eu; test -s '$tmp'; python3 -c \"import json; json.load(open('$tmp', encoding='utf-8'))\"; mv -f '$tmp' '$target'"
          echo "IONOS fallback snapshot installed atomically"
          expected=$(python -c "import json; print(json.load(open('hvf_web/snapshot.json', encoding='utf-8'))['generated_utc'])")
          live=$(curl --fail --silent --show-error --retry 3 "${IONOS_SITE%/}/api/status" | python -c "import json,sys; print(json.load(sys.stdin).get('generated_utc',''))")
          if [ "$live" != "$expected" ]; then
            echo "IONOS live snapshot mismatch: expected $expected, got ${live:-<empty>}" >&2
            exit 1
          fi
          echo "IONOS live snapshot verified: $live"

      - name: Fail if no snapshot publication succeeded
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          IONOS_OUTCOME: ${{ steps.ionos_fallback.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "failure" ] && [ "$IONOS_OUTCOME" != "success" ]; then
            echo "Neither Supabase publication nor the IONOS fallback succeeded" >&2
            exit 1
          fi

      # A run where Supabase publication FAILED must not look identical to one where it succeeded.
      #
      # It did, for fourteen consecutive runs from 2026-08-16. `continue-on-error: true` on the publish
      # step rewrites its CONCLUSION to success -- only `outcome` carries the truth -- and the gate above
      # passes as long as either half worked. So the run was green, every step showed green, and nobody
      # knew Supabase had stopped accepting publications. On 2026-08-31 that surfaced the hard way: the
      # newer snapshots existed ONLY on the web host, a worker restarted, pulled the two-week-old remote
      # over the top, and the live site lost 352 instruments.
      #
      # Deliberately a WARNING and not a failure: during a known quota outage the IONOS fallback keeping
      # the site current is the system working as designed, and a red run every day would be noise that
      # gets muted. What was missing was not severity, it was VISIBILITY -- so this writes the state onto
      # the run summary where it cannot be missed.
      - name: Report which publication route actually carried this run
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          IONOS_OUTCOME: ${{ steps.ionos_fallback.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Supabase publication succeeded." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$IONOS_OUTCOME" = "success" ]; then
            echo "::warning title=Supabase publication failed::The snapshot reached the web host by the IONOS fallback ONLY. Supabase holds an older snapshot, so it is not a usable restore point."
            {
              echo "### :warning: Supabase publication FAILED - IONOS fallback carried this run"
              echo ""
              echo "The new snapshot is on the web host and **nowhere else**. Supabase still holds an"
              echo "older one, so it is NOT a restore point until publication works again."
              echo ""
              echo "The web tier refuses a remote snapshot older than its local copy"
              echo "(\`scanner_snapshot_store.load_snapshot\`), so the site will not regress - but there"
              echo "is no second copy of today's data."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=No publication route succeeded::Neither Supabase nor the IONOS fallback took the snapshot."
            echo "### :x: No publication route succeeded" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Rebuild the precomputed /api/winners payloads for the snapshot this run just published
      # (user 2026-08-23). The server keys a stored payload to the live snapshot's generated_utc, so ANY
      # new snapshot invalidates the previous copies -- a once-daily precompute would only help until the
      # next refresh. Here the runner still has the exact snapshot.json it published, so the key is taken
      # from that file and cannot race a later publication.
      #
      # Non-fatal: this is a cache warm-up. If it fails the site falls back to building the payloads live,
      # which is slow but correct, and the standalone Winners Precompute job retries in the morning.
      - name: Warm the precomputed winners payloads
        if: ${{ steps.publish.outcome == 'success' || steps.ionos_fallback.outcome == 'success' }}
        continue-on-error: true
        run: python run_winners_precompute.py

      # Publishing a snapshot changes generated_utc, which is the key EVERY /api/records cache is held
      # under -- so the moment this job succeeds, the site's Scanner caches are empty again and the next
      # visitor pays the cold build. MEASURED on the live host 2026-09-03: 29.84s cold vs 0.88s warm
      # anonymous, 66.04s vs 0.71s signed in. One request here makes that first caller a robot instead of
      # the requester. The resident warm loop (hvf_web/server.py::_perf_warm_loop) covers worker recycles;
      # this covers the predictable invalidation, which the loop's 10-minute tick could otherwise miss.
      #
      # Non-fatal and unauthenticated on purpose: the public branch shares the 52-week cache with the
      # signed-in one, so it warms the expensive part without a token in the workflow.
      - name: Warm the Scanner caches on the live site
        if: ${{ steps.publish.outcome == 'success' || steps.ionos_fallback.outcome == 'success' }}
        continue-on-error: true
        run: |
          t0=$(date +%s)
          code=$(curl -s -o /dev/null --max-time 300 -w '%{http_code}' https://www.squeezescanner.cloud/api/records)
          echo "scanner warm: HTTP $code in $(( $(date +%s) - t0 ))s" >> "$GITHUB_STEP_SUMMARY"
