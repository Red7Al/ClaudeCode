name: Commodity Monitor XAU/XAG/CL (2026-06-08)

# Scheduling: cron-job.org → workflow_dispatch (AM */30 04-08, PM */30 21-23,
# Mon-Fri). GitHub-native cron REMOVED — banned (unreliable). Gold/Silver/Oil
# trade 24/5; this covers the gaps between session monitors. See feedback_scheduler.md.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_commodity_monitor.py
