name: Seed all app secrets into Supabase (2026-08-02)

# One-time / on-demand MANUAL job (user 2026-08-02, P-05). Encrypts every non-bootstrap secret that exists
# as a GitHub Secret into the Supabase app_secrets store, so the whole app (local server + every Actions
# job) reads them from Supabase via db_pool's bootstrap — the step that lets .env shrink to bootstrap-only.
#
# WHY a workflow: some values (X_*, and QUIVER which is blank locally) live ONLY in GitHub Secrets — nothing
# on the laptop can read them. A workflow HAS them in its env at runtime, so it can encrypt them into the
# store itself. Values already in the store (IG/Slack/FRED/EIA) are re-seeded idempotently; blanks are
# skipped. The script prints key NAMES only, never values.
#
# GitHub cron is BANNED here (all scheduling is cron-job.org); this is workflow_dispatch only.
#
# PREREQUISITE (one manual step): add an APP_SECRET_KEY GitHub Secret whose value is the EXACT contents of
# data/.web_users.key — the Fernet key the local process decrypts with. The guard step fails fast if it,
# or the Supabase bootstrap creds, are missing (so nothing is written with a mismatched key).
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bootstrap (required) — reach + decrypt the store.
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_SECRET_KEY:        ${{ secrets.APP_SECRET_KEY }}
      # Non-bootstrap secrets to seed (any that aren't set as GitHub Secrets resolve to '' and are skipped).
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
      SLACK_DAILY:           ${{ secrets.SLACK_DAILY }}
      SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
      SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
      SLACK_WEEKLY:          ${{ secrets.SLACK_WEEKLY }}
      FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
      QUIVER_QUANT_API_KEY:  ${{ secrets.QUIVER_QUANT_API_KEY }}
      X_API_KEY:             ${{ secrets.X_API_KEY }}
      X_API_SECRET:          ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET:       ${{ secrets.X_ACCESS_SECRET }}
      RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
      YAHOO_USER:            ${{ secrets.YAHOO_USER }}
      YAHOO_APP_PASSWORD:    ${{ secrets.YAHOO_APP_PASSWORD }}
      GH_PAT:                ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # Fail fast if the decrypt key or bootstrap creds are missing — never write rows with a mismatched
      # key. Prints presence only, never values.
      - name: Check prerequisites (no values printed)
        run: |
          python - <<'PY'
          import os, sys
          need = ("APP_SECRET_KEY", "SUPABASE_USER", "SUPABASE_DB_PASSWORD")
          missing = [k for k in need if not os.environ.get(k)]
          if missing:
              print("MISSING required bootstrap secrets:", ", ".join(missing))
              print("Add them in Settings -> Secrets and variables -> Actions. "
                    "APP_SECRET_KEY must equal the contents of data/.web_users.key.")
              sys.exit(1)
          optional = ("IG_API_KEY","SLACK_ALERTS","FRED_API_KEY","EIA_API_KEY","QUIVER_QUANT_API_KEY",
                      "X_API_KEY","X_API_SECRET","X_ACCESS_TOKEN","X_ACCESS_SECRET",
                      "RESEND_API_KEY","YAHOO_USER","YAHOO_APP_PASSWORD","GH_PAT")
          present = [k for k in optional if os.environ.get(k)]
          print("Will seed (present):", ", ".join(present) or "(none)")
          PY
      - name: Seed present secrets into the encrypted app_secrets store
        run: python migrate_secrets_to_supabase.py
      - name: Verify they decrypt back (names only)
        run: python migrate_secrets_to_supabase.py --verify
