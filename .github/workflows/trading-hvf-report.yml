name: HVF Daily Report (2026-06-17)

on:
  workflow_dispatch:           # also triggerable manually
    inputs:
      slack_only:
        description: 'Post the analytical HVF report to Slack ONLY — no X drafts, no live X publish'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # scan 200+ tickers + spaced per-market live-X publish (user 2026-06-17)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_schema.py
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: python run_hvf_report.py
        env:
          HVF_REPORT_SKIP_X:     ${{ inputs.slack_only }}   # slack_only -> no X drafts / no live X (user 2026-06-22)
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
          SLACK_TWITTER:         ${{ secrets.SLACK_TWITTER }}
          SLACK_BOT_TOKEN:       ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TWITTER_CHANNEL_ID: ${{ secrets.SLACK_TWITTER_CHANNEL_ID }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}      # live X publish of top-2/market (user 2026-06-17)
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:       ${{ secrets.X_ACCESS_SECRET }}
