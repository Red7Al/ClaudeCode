name: HVF Daily Report (2026-06-17)

on:
  # Callable so trading-morning-chain.yml can run it in sequence (2026-09-05). The chain
  # exists because these jobs were separately scheduled with GUESSED gaps between them, and
  # the guesses were wrong: the Best Settings audit ran 15 minutes into a 98-110 minute report
  # and built its cards from the PREVIOUS day's scan every single day. Sequencing removes the
  # guess. The inputs mirror workflow_dispatch so ${{ inputs.* }} resolves under either trigger.
  workflow_call:
    inputs:
      report_mode:
        required: false
        type: string
        default: 'normal'
  workflow_dispatch:           # also triggerable manually
    inputs:
      report_mode:
        description: 'normal (Slack + live X) | slack_only (report only, no X) | slack_png (Slack report + card/3yr PNG drafts, no X)'
        type: choice
        options: [normal, slack_only, slack_png]
        default: normal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Temporary direct publication route while Supabase Storage is unavailable.
  IONOS_HOST: ${{ secrets.IONOS_HOST }}
  IONOS_USER: ${{ secrets.IONOS_USER }}
  IONOS_DIR:  ${{ secrets.IONOS_DIR }}
  IONOS_PORT: ${{ secrets.IONOS_PORT || '22' }}
  IONOS_SITE: ${{ secrets.IONOS_SITE || 'https://www.squeezescanner.cloud' }}

jobs:
  run:
    runs-on: ubuntu-latest
    # 2026-08-15: was 45, which the job could not physically meet. It runs the SAME full-universe
    # scan as trading-scanner-snapshot.yml -- which allows 120 minutes and really takes 46-56 --
    # and then publishes and does the spaced per-market live-X posting on top. The old value dates
    # from 2026-06-17 when the comment's "200+ tickers" was accurate; the universe is now ~1,450.
    # Runs on 08-14 and 08-15 were killed at exactly 45m00s and delivered no morning report.
    #
    # 2026-09-28: 120 was reached and the SAME failure happened again, one ceiling higher. This job
    # ran 03:56:34 -> 05:56:51 = 120m00s exactly, which GitHub reports as "cancelled", NOT "failed",
    # so nothing in the run reads as an error. It cascaded: Scanner report email, Winners precompute,
    # Best settings audit and HVF orders were all skipped that morning.
    #
    # THE JOB IS TWO PHASES AND ONLY ONE OF THEM IS VISIBLE. Measured from the logs of the killed run
    # and of the successful 2026-09-27 run (36316886381):
    #
    #                                   09-27 (ok)      09-28 (killed)
    #   scan -> "wrote snapshot.json"      26m               65m
    #   squeeze_history.refresh_daily      51m              >=55m (killed mid-phase)
    #   total                              77m              120m cap
    #
    # refresh_daily emits NOT ONE LOG LINE for ~51 minutes, so the run looks hung when it is working
    # and looks identical when it is genuinely stuck. It was misread as a hang during this very
    # investigation. That near-fixed 51m leaves only ~69m of headroom for the scan under a 120 cap,
    # and the 09-28 scan took 65m. The cap was the binding constraint, not a stall.
    #
    # PART of the 51m phase is fixed in commit e360498: squeeze_history.refresh_daily now writes its
    # 4,287 rows in 9 batched statements instead of 4,287 single-row UPDATEs, and logs its progress.
    #
    # THAT COMMIT'S MESSAGE OVERSTATES IT AND THIS COMMENT CORRECTS THE RECORD. The silent 51 minutes
    # is not one function, it is three, and only one of them is now batched. Round trips per run:
    #
    #   squeeze_history.store()              416   per-row upsert   STILL PER-ROW
    #   squeeze_history.refresh_daily      4,287   per-row UPDATE   FIXED -> 9 batched statements
    #   instrument_metrics.record_daily    3,545   1,773 per-ticker get_bars SELECTs
    #                                              + 1,772 per-ticker INSERTs   STILL PER-ROW
    #                                    -------
    #   old total                          8,248   over a measured 50m59s = ~371 ms per round trip
    #   new total                          3,970
    #
    # So the expected phase is ~25m, not "under a minute". That figure is DERIVED (arithmetic on the
    # measured per-round-trip average), not measured, and stays unproven until a post-fix run lands.
    # 180 is kept for that reason and because the SCAN phase still varies 26m-65m, unmeasured.
    #
    # NOT yfinance throttling -- the killed run's log contains ZERO "Too Many Requests" (grep -c = 0);
    # that guess was checked and discarded. The scan variance is genuinely unexplained and is the next
    # thing to measure. If this comment is being read because 180 was also reached, the answer is NOT
    # 240 -- measure the scan phase.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      # Fail before the full report scan if the temporary fallback points at the wrong domain directory.
      - name: Check IONOS fallback destination
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${IONOS_HOST:-}" ] || missing+=(IONOS_HOST)
          [ -n "${IONOS_USER:-}" ] || missing+=(IONOS_USER)
          [ -n "${IONOS_DIR:-}" ] || missing+=(IONOS_DIR)
          [ -n "${IONOS_SSH_KEY:-}" ] || missing+=(IONOS_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "IONOS fallback is not configured; missing: ${missing[*]}" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ionos_hvf_snapshot_key"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${IONOS_USER}@${IONOS_HOST}" "test -d '$IONOS_DIR/hvf_web' && test -f '$IONOS_DIR/hvf_web/snapshot.json'"
      - run: pip install -r requirements.txt
      - run: python run_schema.py
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Run HVF daily report
        id: report
        run: python run_hvf_report.py
        env:
          HVF_REPORT_MODE:       ${{ inputs.report_mode }}  # normal | slack_only | slack_png (user 2026-06-22)
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SCANNER_PUBLISH_KEY: ${{ secrets.SUPABASE_SCANNER_PUBLISH_KEY }}
          # Publishing the snapshot ends with verify_current(), which is a READ and needs the
          # read-scoped key. Without it the job died on 2026-08-13 with
          # "no server-side Supabase Storage key configured for read" AFTER a successful publish.
          SUPABASE_SCANNER_WEB_KEY: ${{ secrets.SUPABASE_SCANNER_WEB_KEY }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_RW_HVF:          ${{ secrets.SLACK_RW_HVF }}   # extra HVF-report channel (user 2026-06-26, C)
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
          SLACK_TWITTER:         ${{ secrets.SLACK_TWITTER }}
          SLACK_BOT_TOKEN:       ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TWITTER_CHANNEL_ID: ${{ secrets.SLACK_TWITTER_CHANNEL_ID }}
          X_API_KEY:             ${{ secrets.X_API_KEY }}      # live X publish of top-2/market (user 2026-06-17)
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:       ${{ secrets.X_ACCESS_SECRET }}

      # run_hvf_report preserves the completed candidate and writes .ionos-fallback-required when the
      # known Supabase Storage HTTP 402 occurs. Keep the candidate for recovery and install it directly on
      # IONOS before declaring the report run healthy.
      - name: Upload HVF snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvf-daily-scanner-snapshot
          path: hvf_web/snapshot.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish HVF snapshot to IONOS fallback
        id: ionos_fallback
        if: hashFiles('hvf_web/.ionos-fallback-required') != '' && hashFiles('hvf_web/snapshot.json') != ''
        continue-on-error: true
        env:
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${IONOS_HOST:-}" ] || missing+=(IONOS_HOST)
          [ -n "${IONOS_USER:-}" ] || missing+=(IONOS_USER)
          [ -n "${IONOS_DIR:-}" ] || missing+=(IONOS_DIR)
          [ -n "${IONOS_SSH_KEY:-}" ] || missing+=(IONOS_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "IONOS fallback is not configured; missing: ${missing[*]}" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/ionos_hvf_snapshot_key"
          printf '%s\n' "$IONOS_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh_opts=(-i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote="${IONOS_USER}@${IONOS_HOST}"
          target="${IONOS_DIR}/hvf_web/snapshot.json"
          tmp="${target}.tmp-${GITHUB_RUN_ID}"
          # Use SSH streaming rather than SFTP-backed scp: IONOS applies the validated shell path
          # consistently to SSH, whereas its SFTP view may be chrooted differently.
          ssh "${ssh_opts[@]}" "$remote" "umask 077; cat > '$tmp'" < hvf_web/snapshot.json
          ssh "${ssh_opts[@]}" "$remote" "set -eu; test -s '$tmp'; python3 -c \"import json; json.load(open('$tmp', encoding='utf-8'))\"; mv -f '$tmp' '$target'"
          expected=$(python -c "import json; print(json.load(open('hvf_web/snapshot.json', encoding='utf-8'))['generated_utc'])")
          live=$(curl --fail --silent --show-error --retry 3 "${IONOS_SITE%/}/api/status" | python -c "import json,sys; print(json.load(sys.stdin).get('generated_utc',''))")
          [ "$live" = "$expected" ] || { echo "IONOS live snapshot mismatch: expected $expected, got ${live:-<empty>}" >&2; exit 1; }
          echo "IONOS live snapshot verified: $live"

      - name: Fail if HVF fallback was required but not live
        if: always()
        env:
          FALLBACK_REQUIRED: ${{ hashFiles('hvf_web/.ionos-fallback-required') }}
          IONOS_OUTCOME: ${{ steps.ionos_fallback.outcome }}
        run: |
          if [ -n "$FALLBACK_REQUIRED" ] && [ "$IONOS_OUTCOME" != "success" ]; then
            echo "Supabase Storage was unavailable and the IONOS fallback did not verify" >&2
            exit 1
          fi

      # This must run in the scanner worker, after the current snapshot has been produced.  The separate
      # overnight broker-price audit has no snapshot and must never write a misleading zero-row result.
      - name: Audit and repair current Instrument metrics
        if: success()
        run: python run_data_quality_audit.py --current-metrics-only
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Authoritative Best Settings review follows the current-metric repair, so its evidence cannot
      # describe a different post-refresh data state.
      - name: Run persisted Best Settings full-grid audit
        if: success()
        run: python run_best_settings_audit.py
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
