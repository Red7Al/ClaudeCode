name: US Monitor (5 min — 2026-06-09)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # accommodates up to 15 spread retries x 20s (~5 min)
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
      QUIVER_QUANT_API_KEY:  ${{ secrets.QUIVER_QUANT_API_KEY }}
      SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
      SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
      YAHOO_USER:            ${{ secrets.YAHOO_USER }}
      YAHOO_APP_PASSWORD:    ${{ secrets.YAHOO_APP_PASSWORD }}
      RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py US_MONITOR
