name: US Monitor (15 min)

on:
  schedule:
    - cron: '*/20 14-20 * * 1-5'  # Every 20 min, 14:00-20:59 UTC (US session)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
      SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py US_MONITOR
