name: Weekend Review

on:
  schedule:
    - cron: '0 9 * * 6'     # 09:00 UTC Saturday
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py WEEKEND_REVIEW
        env:
          IG_API_KEY:            ${{ secrets.IG_API_KEY }}
          IG_USERNAME:           ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
          SLACK_WEEKLY:          ${{ secrets.SLACK_WEEKLY }}
