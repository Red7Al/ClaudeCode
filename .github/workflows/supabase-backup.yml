name: Supabase database backup (2026-10-23)

# Self-managed logical backup of the Supabase Postgres DB (user 2026-08-02, P-25). Supabase's own scheduled
# backups are a paid feature; this is the free alternative — a read-only pg_dump to a compressed
# custom-format file, installed on IONOS OUTSIDE the web root (/home/www/data/backups, owner-only
# permissions; the site is /home/www/squeezescanner), newest 7 kept.
#
# NEVER a GitHub artifact (owner 2026-10-21: "the github repository is for code not reports"). The repository
# is PUBLIC: this job used to upload every dump as an artifact, and on 2026-10-21 50 of them (3,873 MB, every
# table) were listed publicly (measured) and, per GitHub's documentation, downloadable by any signed-in user.
#
# price_history's ROWS are not dumped (owner 2026-10-23: "yes"): the table is most of every dump's egress
# (~0.55 GB/month of the free 5 GB, DERIVED from COPY row counts) and already has a verified full copy on IONOS --
# the price bars file (/home/www/data/price_bars), compared with the database on every build. Its structure is
# still dumped. The file lacks recorded_at, and IONOS keeps only the latest file.
#
# Server is Postgres 17.6, so the client is pinned to 17 (pg_dump must be >= the server major version).
# The connection uses the SESSION pooler (port 5432) — the same endpoint db_pool uses; the transaction
# pooler (6543) is NOT usable for pg_dump.
#
# GitHub cron is BANNED in this repo (all scheduling is cron-job.org); this is workflow_dispatch only — run
# it by hand from the Actions tab, or point a cron-job.org job at it (weekly is a sensible cadence). Read
# only; it never writes to the database.
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_SECRET_KEY:       ${{ secrets.APP_SECRET_KEY }}
    steps:
      - name: Guard — bootstrap creds present (no values printed)
        run: |
          if [ -z "$SUPABASE_USER" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "MISSING SUPABASE_USER / SUPABASE_DB_PASSWORD secrets."; exit 1
          fi
          echo "Bootstrap creds present."
      # Checkout + Python added 2026-08-11 (user, P-12) solely so the final step below can call
      # web_store.append_batch — this job otherwise only shells out to pg_dump.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: Dump database (custom format, compressed)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%SZ)
          echo "stamp=$STAMP" >> "$GITHUB_ENV"
          pg_dump \
            -h aws-0-eu-west-1.pooler.supabase.com -p 5432 \
            -U "$SUPABASE_USER" -d postgres \
            --schema=public --no-owner --no-privileges -Fc \
            --exclude-table-data=public.price_history \
            -f "supabase-$STAMP.dump"
          ls -lh "supabase-$STAMP.dump"
      # The dump must restore: pg_restore --list reads its whole table of contents. The 17 binary by path: the
      # runner's default pg_restore is older and refuses the 1.16 format ("unsupported version", run 39591920222). Then it lands under a
      # temporary name, its size is checked on the host, and it is renamed; the oldest beyond 7 are removed.
      - name: Check the dump and install it on IONOS
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          f="supabase-$stamp.dump"
          entries=$(/usr/lib/postgresql/17/bin/pg_restore --list "$f" | grep -vc '^;')
          tables=$(/usr/lib/postgresql/17/bin/pg_restore --list "$f" | grep -c ' TABLE DATA ')
          echo "$f: $(stat -c %s "$f") bytes, $entries entries, $tables tables with data"
          [ "$tables" -gt 0 ] || { echo "dump holds no table data" >&2; exit 1; }
          /usr/lib/postgresql/17/bin/pg_restore --list "$f" | grep -q " TABLE public price_history " \
            || { echo "dump lacks the price_history table definition" >&2; exit 1; }
          key="$RUNNER_TEMP/ionos_key"; printf '%s\n' "$IONOS_SSH_KEY" > "$key"; chmod 600 "$key"
          ssh="ssh -i $key -p $IONOS_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new ${IONOS_USER}@${IONOS_HOST}"
          dir=/home/www/data/backups
          $ssh "umask 077; mkdir -p $dir; cat > $dir/$f.new" < "$f"
          $ssh "set -eu; test \$(stat -c %s $dir/$f.new) = $(stat -c %s "$f"); mv -f $dir/$f.new $dir/$f; ls -1t $dir/supabase-*.dump | tail -n +8 | xargs -r rm -f; ls -l $dir"
      - name: Record in Batch Activity (user 2026-08-11, P-12 — any batch activity under 6x/day should log)
        run: |
          python - <<'PY'
          import os
          from web_store import append_batch
          size = 0
          for f in os.listdir("."):
              if f.startswith("supabase-") and f.endswith(".dump"):
                  size = os.path.getsize(f)
          append_batch("cron-job.org", f"Supabase database backup — {size/1_048_576:.1f} MB", by="cron")
          PY
