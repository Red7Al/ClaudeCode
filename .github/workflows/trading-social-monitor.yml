name: Social Feed Monitor (2026-06-09)

# Triggered by cron-job.org "Social Monitor" (*/15 07-22 Mon-Fri) → workflow_dispatch.
# The old "(2 hourly)" name was a leftover from a GitHub-native schedule; GitHub
# cron is BANNED here (see memory/feedback_scheduler.md) — there is NO schedule:
# block. All scheduling is cron-job.org.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
      SLACK_TWITTER:         ${{ secrets.SLACK_TWITTER }}
      # Needed to attach the HVF card PNG to the dossier post (user 2026-06-23).
      # SLACK_SIGNALS_CHANNEL_ID = the #signals channel id; SLACK_BOT_TOKEN must
      # have files:write. Absent -> dossier still posts text, just no PNG.
      SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNALS_CHANNEL_ID: ${{ secrets.SLACK_SIGNALS_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python social_monitor.py
