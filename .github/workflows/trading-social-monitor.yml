name: Social Feed Monitor (2 hourly)

on:
  schedule:
    - cron: '0 */2 * * 1-5'   # Every 2 hours on weekdays
    - cron: '0 10,14,18 * * 0,6'  # 3x on weekends (Sat/Sun)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Scan X accounts for new picks
        run: python -c "
import os, sys
sys.path.insert(0, '.')
from social_monitor import scan_social_feeds
picks = scan_social_feeds(max_age_hours=3)
print(f'New picks found: {len(picks)}')
for p in picks:
    print(f'  {p[\"ticker\"]} from {p[\"investor_name\"]}')
"
        env:
          IG_API_KEY:            ${{ secrets.IG_API_KEY }}
          IG_USERNAME:           ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
