name: Trade Email Test (2026-06-09)

# One-shot: send a sample trade-open email (IBM, with price/volume/HVF charts) via
# Yahoo SMTP to config.EMAIL_RECIPIENTS, to verify end-to-end delivery. Dispatch
# manually. workflow_dispatch only — GitHub-native cron is BANNED.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      YAHOO_USER:           ${{ secrets.YAHOO_USER }}
      YAHOO_APP_PASSWORD:   ${{ secrets.YAHOO_APP_PASSWORD }}
      RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
      EMAIL_DEBUG:          "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python trade_email.py --send
