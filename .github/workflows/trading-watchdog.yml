name: Session Watchdog (2026-10-08)

# Scheduling: cron-job.org → workflow_dispatch (every 30min Mon-Fri, job id 7767389).
# GitHub-native cron REMOVED — it is banned (unreliable) and was running this
# watchdog only ~every 4.5h instead of 30min. See memory/feedback_scheduler.md.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The watchdog re-dispatches a missed session workflow. The repo's default token is read-only
# (default_workflow_permissions: read, measured 2026-10-08), so every re-dispatch got
# "403 Resource not accessible by integration". It now only re-dispatches sessions whose
# cron-job.org job is enabled, so granting this cannot restart a session that is off on purpose.
permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pg8000 python-dotenv cryptography
      - run: python run_session_watchdog.py
        env:
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APP_SECRET_KEY:       ${{ secrets.APP_SECRET_KEY }}
          SLACK_ALERTS:         ${{ secrets.SLACK_ALERTS }}
          SLACK_SIGNALS:        ${{ secrets.SLACK_SIGNALS }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
