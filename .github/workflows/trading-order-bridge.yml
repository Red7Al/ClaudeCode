name: Order Bridge (snapshot -> IG working orders, 2026-10-27)

# Database -> IG working-order bridge (hvf_web/order_bridge.py) for the FULL scanned universe.
#
# WHY THIS WORKFLOW EXISTS: the bridge used to be a background thread in hvf_web/server.py, started
# from `if __name__ == "__main__":` — so it only ever ran while the laptop hosted the site. The move to
# IONOS (https://www.squeezescanner.cloud/, served via CGI/WSGI) means __main__ never executes and the
# bridge stopped running anywhere. IONOS_DEPLOYMENT.md §4 says to keep order bridging "in their existing
# scheduler" precisely because a WSGI host runs several worker processes and an order loop in each would
# risk duplicate placement. One scheduled job is that single owner.
#
# Placement stays on the SAME guarded path the session monitors use — ig_shim.place_hvf_order_from_sig —
# which enforces config_store.monitor_enabled("WEB_BRIDGE") (the Trading (Squeeze) toggle), the quality
# floor, the 1.5% proximity band, the owner's personal trading limits with require_data=True (so an
# unavailable VWAP/ATR BLOCKS rather than bypasses), margin-aware sizing and the circuit breakers.
# order_bridge itself caps NEW placements at BRIDGE_MAX_PER_RUN (6) per pass.
#
# No schedule: block — GitHub-native cron is banned; timing lives on cron-job.org via setup_cronjobs.JOBS.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never let two passes overlap: the duplicate guard is a working_orders lookup at the START of a pass,
# so concurrent runs could both see a ticker as free and place it twice. Queue instead of cancelling —
# cancelling mid-pass could abandon a run between an IG placement and its working_orders write.
concurrency:
  group: order-bridge
  cancel-in-progress: false

# Nothing here needs write, and since 2026-10-21 nothing reads an artifact either.
permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # ── The evening snapshot, from IONOS (2026-10-21) ─────────────────────────────────────────────
      # The bridge reads the Scanner snapshot to know which pre-orders are ready. Supabase Storage has
      # returned 402 since 2026-08-16, and hvf_web/snapshot.json is gitignored, so a clean runner has no
      # fallback: from 12 to 17 August the bridge went blind and placed nothing (it failed safe).
      #
      # It came from a GitHub artifact from 2026-08-17 to 2026-10-21. The repository is PUBLIC and is for
      # code, not reports (owner 2026-10-21), so Scanner Snapshot Publish keeps the snapshot it built on
      # IONOS outside the web root (/home/www/data/evening) and the bridge fetches it over SSH. It is the
      # EVENING snapshot on purpose: the bridge trades on it all day.
      - name: Fetch the latest Scanner snapshot
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/fetch_ionos_evening.sh snapshot.json hvf_web || {
            echo "::error::no evening snapshot on IONOS. Run Scanner Snapshot Publish."
            exit 1
          }
          python - <<'PY'
          import datetime as dt, json, sys
          with open("hvf_web/snapshot.json", encoding="utf-8") as fh:
              d = json.load(fh)
          if d.get("count") != len(d.get("records") or []):
              sys.exit(f"corrupt snapshot: count {d.get('count')} != {len(d.get('records') or [])}")
          gen = dt.datetime.fromisoformat(d["generated_utc"])
          age = (dt.datetime.now(dt.timezone.utc) - gen).total_seconds() / 3600
          print(f"snapshot {d['generated_utc']}  {d['count']} records  ({age:.1f}h old)")
          # Refuse to place real orders against stale prices. Scanner Snapshot Publish runs daily, so
          # 36h means two consecutive scans failed -- at which point not trading is the right answer.
          if age > 36:
              sys.exit(f"snapshot is {age:.1f}h old (limit 36h) - refusing to place orders on stale prices")
          PY

      # The report summary for this snapshot (2026-10-13). _live_vwap_atr reads it instead of price_history
      # when its generated_utc matches the snapshot's; otherwise it falls back to the database exactly as
      # before. Best effort: a missing file never stops the bridge. ONLY the evening summary, the one built
      # with the evening snapshot: the Morning Chain's newer summary is for the morning snapshot and would
      # never match (measured 2026-10-13). From IONOS since 2026-10-21, as the snapshot above.
      - name: Fetch the report summary
        continue-on-error: true
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -uo pipefail
          bash .github/scripts/fetch_ionos_evening.sh report_summary.json hvf_web || {
            echo "no evening summary on IONOS - the bridge reads the database"; exit 0; }
          python -c "import json; s=json.load(open('hvf_web/report_summary.json', encoding='utf-8')); n=json.load(open('hvf_web/snapshot.json', encoding='utf-8')); print('summary', s.get('generated_utc'), '| snapshot', n.get('generated_utc'), '| in use:', s.get('generated_utc') == n.get('generated_utc'))"

      # Clear dead working orders BEFORE the bridge builds its skip-list from them (2026-09-11).
      #
      # _already_working() skips any ticker holding a PENDING or WATCHING row, so a row that IG no longer
      # has silently keeps the bridge off that instrument -- no log line, no record. Measured 2026-09-03:
      # the skip-list held 95 tickers while IG held SIX working orders, and six of that day's 29 candidates
      # were skipped because of orders that did not exist. That is lost trading, not a reporting fault.
      #
      # It runs HERE rather than on its own schedule so it cannot drift from the thing that needs it: the
      # skip-list is rebuilt on the next line, from the table this just corrected.
      #
      # Only rows working_order_state calls DEAD are touched -- gone from IG, matching no open position,
      # and unable to come back. A fill and a live WATCHING row are both left alone; reading absence as
      # death is what expired 12 fills and 19 live watching orders on 2026-09-04.
      #
      # continue-on-error: a sweep failure must not stop the bridge. The consequence is the stale skip-list
      # we already had, which fails safe -- the bridge places fewer orders, never wrong ones.
      - name: Clear dead working orders so the skip-list is real
        continue-on-error: true
        env:
          IG_API_KEY:           ${{ secrets.IG_API_KEY }}
          IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:        ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          YAHOO_USER:           ${{ secrets.YAHOO_USER }}
          YAHOO_APP_PASSWORD:   ${{ secrets.YAHOO_APP_PASSWORD }}
          APP_SECRET_KEY:       ${{ secrets.APP_SECRET_KEY }}
        run: python run_working_order_sweep.py --apply

      - run: python -m hvf_web.order_bridge
        env:
          IG_API_KEY:                  ${{ secrets.IG_API_KEY }}
          IG_USERNAME:                 ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:                 ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:               ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:               ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:        ${{ secrets.SUPABASE_DB_PASSWORD }}
          RESEND_API_KEY:              ${{ secrets.RESEND_API_KEY }}
          YAHOO_USER:                  ${{ secrets.YAHOO_USER }}
          YAHOO_APP_PASSWORD:          ${{ secrets.YAHOO_APP_PASSWORD }}
          APP_SECRET_KEY:              ${{ secrets.APP_SECRET_KEY }}
          # Read-scoped Storage key: the bridge PULLS the published Scanner snapshot, never publishes.
          SUPABASE_SCANNER_WEB_KEY:    ${{ secrets.SUPABASE_SCANNER_WEB_KEY }}
          FRED_API_KEY:                ${{ secrets.FRED_API_KEY }}
          SLACK_ORDERS:                ${{ secrets.SLACK_ORDERS }}
          SLACK_TRADES:                ${{ secrets.SLACK_TRADES }}
          SLACK_ALERTS:                ${{ secrets.SLACK_ALERTS }}
      - name: Alert on failure
        if: failure()
        env:
          SLACK_ALERTS: ${{ secrets.SLACK_ALERTS }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' --data \
            '{"text":"🚨 Order Bridge pass FAILED — snapshot pre-orders were not routed to IG this cycle. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_ALERTS"
