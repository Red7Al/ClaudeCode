name: US HVF Watch (2-hourly) 2026-06-16

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
      QUIVER_QUANT_API_KEY:  ${{ secrets.QUIVER_QUANT_API_KEY }}
      SLACK_SIGNALS:         ${{ secrets.SLACK_SIGNALS }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
      SLACK_TWITTER:         ${{ secrets.SLACK_TWITTER }}
      SLACK_BOT_TOKEN:       ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TWITTER_CHANNEL_ID: ${{ secrets.SLACK_TWITTER_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # Tweet feed (user 2026-06-16: graphs + summary + long report together each run).
      - run: python run_session.py US_HVF_WATCH      # HVF graphs + summary tweets → #arw-claude-twitter
      - run: python quality_report.py --daily        # long narrative report (only setups that changed since last run)
        if: always()                                  # post the long report even if the watch step had no new setups
