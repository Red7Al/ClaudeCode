name: Bounce Alert (recently-sold reversal — 2026-06-26)

# Backlog E: URGENT email if an instrument we SOLD in the last 48h bounces >=2% above the
# sell level. Reads the shared IG account's /history/activity. Schedule via cron-job.org
# hitting workflow_dispatch (same model as the other run_*.py jobs); suggested every 15 min.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      YAHOO_USER:            ${{ secrets.YAHOO_USER }}
      YAHOO_APP_PASSWORD:    ${{ secrets.YAHOO_APP_PASSWORD }}
      RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_bounce_alert.py
