name: X Publish — instrument or top-N/market (2026-06-17)

# Live-publish to X (Twitter) via publish_one_to_x.py -> x_publish. Either ONE instrument (full
# thread: short+card lead, then the long 1/n report), OR a BATCH of today's top-N tradeable per
# market (top_per_market input), spaced so threads don't overlap. Runs in Actions WITH the X_*
# secrets (memory: secrets_and_x_delivery — the local machine has no X_* keys and never posts).
#
# workflow_dispatch only — fires REAL, public, irreversible tweets when invoked.
# No `schedule:` block (memory: feedback_scheduler — GitHub-native cron is BANNED).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Single ticker to publish (ignored if top_per_market > 0)'
        required: false
        default: 'AXP'
      top_per_market:
        description: "Batch: publish today's top-N tradeable per market (0 = single-ticker mode)"
        required: false
        default: '0'
      dry:
        description: 'Dry run (build + print the tweet, post NOTHING)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force re-publish even if already posted within the dedup window (12h)'
        type: boolean
        required: false
        default: false
      no_register:
        description: 'TEST: post Slack draft + live X but do NOT record (dedup table untouched)'
        type: boolean
        required: false
        default: false
      slack_only:
        description: 'Post the Slack publication ONLY (card + 3yr PNG + long report), no X'
        type: boolean
        required: false
        default: false
      delete_lead_ids:
        description: 'DELETE mode: comma-separated lead tweet IDs to remove (lead + thread). Irreversible.'
        required: false
        default: ''
      list_recent:
        description: 'LIST mode: print the N most recent publications (ticker, lead id, URL) to pick delete IDs. 0 = off.'
        required: false
        default: '0'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Publish to X
        run: |
          if [ "${{ inputs.list_recent }}" != "0" ] && [ -n "${{ inputs.list_recent }}" ]; then
            python publish_one_to_x.py --list-recent=${{ inputs.list_recent }}
          elif [ -n "${{ inputs.delete_lead_ids }}" ]; then
            python publish_one_to_x.py --delete-leads=${{ inputs.delete_lead_ids }}
          elif [ "${{ inputs.top_per_market }}" != "0" ] && [ -n "${{ inputs.top_per_market }}" ]; then
            python publish_one_to_x.py --top-per-market=${{ inputs.top_per_market }} ${{ inputs.dry && '--dry' || '' }}
          else
            python publish_one_to_x.py ${{ inputs.ticker }} ${{ inputs.dry && '--dry' || '' }} ${{ inputs.force && '--force' || '' }} ${{ inputs.no_register && '--no-register' || '' }} ${{ inputs.slack_only && '--slack-only' || '' }}
          fi
        env:
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_TWITTER:        ${{ secrets.SLACK_TWITTER }}   # X-draft + confirmation (user 2026-06-16)
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}          # card image upload to the Slack draft
          SLACK_TWITTER_CHANNEL_ID: ${{ secrets.SLACK_TWITTER_CHANNEL_ID }}
