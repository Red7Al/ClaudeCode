name: Best Settings Full-grid Audit (2026-10-30)

# cron-job.org dispatches this at 07:50 UTC Mon-Sat -- AFTER the HVF Daily Report has published
# the day's snapshot (it starts 05:30 and takes 82-109 minutes). It used to run at 05:45, 15
# minutes into that report, so it built the public cards from the previous day's scan and the
# report then invalidated them. It is analytical only:
# it never changes a user's configuration, places orders, or calls the broker.
on:
  # Callable so trading-morning-chain.yml can run it in sequence (2026-09-05). The chain
  # exists because these jobs were separately scheduled with GUESSED gaps between them, and
  # the guesses were wrong: the Best Settings audit ran 15 minutes into a 98-110 minute report
  # and built its cards from the PREVIOUS day's scan every single day. Sequencing removes the
  # guess. The inputs mirror workflow_dispatch so ${{ inputs.* }} resolves under either trigger.
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_SECRET_KEY:       ${{ secrets.APP_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_schema.py
      # The price bars file (owner 2026-10-21: read files, not the database; shadow 10-22/23 showed no
      # difference). A failed fetch exports nothing (database as before).
      # ON (owner 2026-10-23: "move this live asap - we do not have free resource to cover this egress"): the file
      # answers when it is CURRENT (same row count and newest stamp as price_history); otherwise the database.
      - name: Fetch the price bars file (on)
        continue-on-error: true
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: bash .github/scripts/fetch_price_bars.sh on
      # The squeeze history file (2026-10-30): the bridge-eligible squeeze_history rows at the table's write counter,
      # used only while that counter is unchanged (server._squeeze_history_from_file); a failed fetch exports nothing
      # and the job reads the database exactly as before. MEASURED 10-26 22:17Z -> 10-30 11:32Z: 34 reads /
      # 1,111,532 rows, the biggest query by rows.
      - name: Fetch the squeeze history file
        continue-on-error: true
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: bash .github/scripts/squeeze_history_file.sh get
      - run: python run_best_settings_audit.py
