name: Best Settings Full-grid Audit

# cron-job.org dispatches this at 05:45 UTC Mon-Sat. It is analytical only:
# it never changes a user's configuration, places orders, or calls the broker.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_schema.py
      - run: python run_best_settings_audit.py
