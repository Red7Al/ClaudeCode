name: HVF Orders (2026-06-19)

on:
  workflow_dispatch:           # also triggerable manually

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    # 60, raised from 30 on 2026-09-05. The scan sits right ON the old boundary and usually loses:
    # of the last six runs, FIVE were killed at exactly 30 minutes and the one success took 29. GitHub
    # reports a timed-out job as "cancelled", which is why this looked like an unexplained cancellation
    # rather than a timeout. A killed run is still mid-scan -- the 2026-09-05 run was processing Belgian
    # tickers at 06:31 -- so it never reaches the Slack post and the job delivers NOTHING. Actionable
    # setups have therefore not been posted since 2026-09-02.
    #
    # The cap is the symptom, not the disease: this runs at 06:00 against a database the HVF Daily Report
    # is still hammering until ~07:20, and every db_pool.get_db() call opens a fresh connection costing
    # 228ms. Raising the ceiling makes the job deliver again; making it fast is separate work.
    timeout-minutes: 60        # scan 200+ tickers + single Slack post (no live-X here)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_schema.py
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: python run_hvf_orders.py
        env:
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_ORDERS:          ${{ secrets.SLACK_ORDERS }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
