name: UK Morning Brief (Mon & Fri 9am)

on:
  push:
    paths:
      - 'uk_brief_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Parse window from trigger file
        run: |
          if grep -q "BRIEF_START_UTC=" uk_brief_trigger.txt 2>/dev/null; then
            grep "BRIEF_START_UTC=" uk_brief_trigger.txt >> $GITHUB_ENV || true
            grep "BRIEF_END_UTC="   uk_brief_trigger.txt >> $GITHUB_ENV || true
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install requests pg8000 python-dotenv
      - run: python run_uk_morning_brief.py
        env:
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_DAILY:          ${{ secrets.SLACK_DAILY }}
          BRIEF_START_UTC:      ${{ env.BRIEF_START_UTC }}
          BRIEF_END_UTC:        ${{ env.BRIEF_END_UTC }}
