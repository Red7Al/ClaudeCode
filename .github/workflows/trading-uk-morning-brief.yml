name: UK Morning Brief (Mon & Fri 9am)

on:
  workflow_dispatch:
    inputs:
      brief_start_utc:
        description: 'Override window start (YYYY-MM-DD HH:MM:SS UTC) — leave blank for auto'
        required: false
        default: ''
      brief_end_utc:
        description: 'Override window end (YYYY-MM-DD HH:MM:SS UTC) — leave blank for auto'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install requests pg8000 python-dotenv
      - run: python run_uk_morning_brief.py
        env:
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_DAILY:          ${{ secrets.SLACK_DAILY }}
          BRIEF_START_UTC:      ${{ github.event.inputs.brief_start_utc }}
          BRIEF_END_UTC:        ${{ github.event.inputs.brief_end_utc }}
