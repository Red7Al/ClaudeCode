name: Winners Precompute (daily — 2026-08-23)

# Builds the /api/winners payloads ahead of time so Best Settings does not pay for them on a user's first
# visit. Triggered by cron-job.org via workflow_dispatch at 05:50 UTC Mon-Sat — NEVER add a schedule:
# block (GitHub-native cron is banned, user directive 2026-06-07).
#
# Placed after the 04:30 Price Data Refresh and the 05:30 HVF Daily Report, so it builds from the day's
# refreshed price history rather than racing it.
#
# The server accepts a stored payload only when the snapshot generation time recorded alongside it matches
# the one now live and the copy is under a day old, so a missed or failed run makes Best Settings slow,
# never wrong. run_winners_precompute.py also refuses to store an empty population for the same reason.
on:
  # Callable so trading-morning-chain.yml can run it in sequence (2026-09-05). The chain
  # exists because these jobs were separately scheduled with GUESSED gaps between them, and
  # the guesses were wrong: the Best Settings audit ran 15 minutes into a 98-110 minute report
  # and built its cards from the PREVIOUS day's scan every single day. Sequencing removes the
  # guess. The inputs mirror workflow_dispatch so ${{ inputs.* }} resolves under either trigger.
  workflow_call:
    inputs:
      years:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated windows to build (default 1,3 — the two the web app requests).'
        required: false
        default: ''
      dry_run:
        description: 'Build and report timings without storing anything.'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions:read is what `gh run download` needs to reach the publish run's scanner-snapshot artifact.
    # Stated explicitly rather than inherited: this workflow is REUSABLE and is called by
    # trading-morning-chain.yml, so its token permissions come from the caller unless they are pinned
    # here, and a permission that silently narrows would put this job straight back to refusing.
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      IG_API_KEY:           ${{ secrets.IG_API_KEY }}
      IG_USERNAME:          ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:        ${{ secrets.IG_ACCOUNT_ID }}
      PYTHONIOENCODING:     utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # THE SNAPSHOT IS AN INPUT AND A BARE RUNNER HAS NONE. hvf_web/snapshot.json is gitignored
      # (hvf_web/.gitignore:2), so a fresh checkout has no records, and run_winners_precompute then
      # REFUSES to store rather than write rows carrying the ticker in place of the name and no
      # location. That refusal is correct and is why this job has failed every scheduled run since
      # 2026-09-15 -- before the guard existed, the 2026-09-14 run "succeeded" while storing 6,444
      # annual and 17,477 three-year rows with ZERO real names and ZERO locations, and the site served
      # that all day. The job's own fallback was Supabase Storage, which has returned 402 since
      # 2026-08-16 (exceed_egress_quota) and is not coming back without an account change.
      #
      # So take the snapshot from the publish run's artifact instead, which needs no Supabase Storage
      # and is the same route trading-thread-precompute.yml uses. Failing loudly here is deliberate:
      # without records this job can only refuse, so there is nothing to be gained by continuing.
      - name: Fetch the built snapshot from the latest publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --workflow=trading-scanner-snapshot.yml --status=success \
                  --limit 1 --json databaseId -q '.[0].databaseId')
          test -n "$RUN" || { echo "no successful Scanner Snapshot Publish run to take a snapshot from" >&2; exit 1; }
          echo "using scanner-snapshot from run $RUN"
          gh run download "$RUN" -n scanner-snapshot -D /tmp/snap
          mkdir -p hvf_web && cp /tmp/snap/snapshot.json hvf_web/snapshot.json
          python - <<'PY'
          import json
          d = json.load(open('hvf_web/snapshot.json', encoding='utf-8'))
          recs = d.get('records') or []
          named = sum(1 for r in recs if (r.get('name') or '').strip())
          print(f"seeded {len(recs)} records ({d.get('generated_utc')}), {named} with a name")
          if not recs:
              raise SystemExit("snapshot carries no records; the precompute would only refuse")
          PY
      - name: Build and store the winners payloads
        run: |
          ARGS=""
          if [ -n "${{ inputs.years }}" ]; then ARGS="$ARGS --years ${{ inputs.years }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python run_winners_precompute.py $ARGS
