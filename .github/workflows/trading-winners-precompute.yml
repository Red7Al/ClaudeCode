name: Winners Precompute (daily — 2026-08-23)

# Builds the /api/winners payloads ahead of time so Best Settings does not pay for them on a user's first
# visit. Triggered by cron-job.org via workflow_dispatch at 05:50 UTC Mon-Sat — NEVER add a schedule:
# block (GitHub-native cron is banned, user directive 2026-06-07).
#
# Placed after the 04:30 Price Data Refresh and the 05:30 HVF Daily Report, so it builds from the day's
# refreshed price history rather than racing it.
#
# The server accepts a stored payload only when the snapshot generation time recorded alongside it matches
# the one now live and the copy is under a day old, so a missed or failed run makes Best Settings slow,
# never wrong. run_winners_precompute.py also refuses to store an empty population for the same reason.
on:
  # Callable so trading-morning-chain.yml can run it in sequence (2026-09-05). The chain
  # exists because these jobs were separately scheduled with GUESSED gaps between them, and
  # the guesses were wrong: the Best Settings audit ran 15 minutes into a 98-110 minute report
  # and built its cards from the PREVIOUS day's scan every single day. Sequencing removes the
  # guess. The inputs mirror workflow_dispatch so ${{ inputs.* }} resolves under either trigger.
  workflow_call:
    inputs:
      years:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated windows to build (default 1,3 — the two the web app requests).'
        required: false
        default: ''
      dry_run:
        description: 'Build and report timings without storing anything.'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned rather than inherited: this workflow is REUSABLE and is called by trading-morning-chain.yml,
    # so its token permissions come from the caller unless stated here. The seeding step reads the LIVE
    # SITE over HTTPS and needs no Actions scope, so contents:read is all it takes.
    permissions:
      contents: read
    env:
      SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      IG_API_KEY:           ${{ secrets.IG_API_KEY }}
      IG_USERNAME:          ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:        ${{ secrets.IG_ACCOUNT_ID }}
      PYTHONIOENCODING:     utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # THE SNAPSHOT IS AN INPUT AND A BARE RUNNER HAS NONE. hvf_web/snapshot.json is gitignored
      # (hvf_web/.gitignore:2), so a fresh checkout has no records, and run_winners_precompute then
      # REFUSES to store rather than write rows carrying the ticker in place of the name and no
      # location. That refusal is correct and is why this job has failed every scheduled run since
      # 2026-09-15 -- before the guard existed, the 2026-09-14 run "succeeded" while storing 6,444
      # annual and 17,477 three-year rows with ZERO real names and ZERO locations, and the site served
      # that all day. The job's own fallback was Supabase Storage, which has returned 402 since
      # 2026-08-16 (exceed_egress_quota) and is not coming back without an account change.
      #
      # SEED FROM THE LIVE SITE, NOT FROM THE PUBLISH ARTIFACT, and the difference is the whole point.
      # A stored payload is served only if its dataset key equals the snapshot the SITE is serving; a
      # mismatch makes _winners_stored reject it silently and the page builds live instead. The publish
      # artifact is the PREVIOUS EVENING's scan, and the Morning Chain's own earlier steps rebuild the
      # snapshot before this step runs -- measured 2026-09-21: artifact 2026-09-20T19:18:08 against a
      # live site on 2026-09-21T04:54:01. Seeding from the artifact therefore turns a red job green
      # while every payload it writes is discarded, which is worse than the honest failure it replaced.
      #
      # /api/records carries what this job needs and is keyed to the live scan by construction: measured
      # 1,773 records, all with name, location and market (sector 1,569, its real coverage). It strips
      # `_card`, which does not matter here -- that is why trading-thread-precompute.yml DOES take the
      # artifact, because the thread text needs the card. Market cap is not read from the snapshot at
      # all; _sqa_all_rows takes it from instrument_mcap via _mcap_map.
      #
      # Failing loudly is deliberate: without records this job can only refuse, so a quiet skip would
      # just restore the silence this commit exists to end.
      - name: Seed the snapshot from the live site
        env:
          IONOS_SITE: ${{ secrets.IONOS_SITE }}
        run: |
          set -euo pipefail
          mkdir -p hvf_web
          curl --fail --silent --show-error --retry 3 "${IONOS_SITE%/}/api/records" -o hvf_web/snapshot.json
          python - <<'PY'
          import json
          d = json.load(open('hvf_web/snapshot.json', encoding='utf-8'))
          recs = d.get('records') or []
          named = sum(1 for r in recs if (r.get('name') or '').strip())
          located = sum(1 for r in recs if (r.get('location') or '').strip())
          print(f"seeded {len(recs)} records ({d.get('generated_utc')}), {named} named, {located} located")
          if not recs:
              raise SystemExit("the live site returned no records; the precompute would only refuse")
          if named < len(recs):
              raise SystemExit(f"only {named} of {len(recs)} records carry a name; refusing to build "
                               "rows that would show the ticker in place of the company")
          PY
      - name: Build and store the winners payloads
        run: |
          ARGS=""
          if [ -n "${{ inputs.years }}" ]; then ARGS="$ARGS --years ${{ inputs.years }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python run_winners_precompute.py $ARGS
