name: Create .env file (2026-06-03b)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-env:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Write .env file via Python
        env:
          V_SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          V_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          V_FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          V_EIA_API_KEY:          ${{ secrets.EIA_API_KEY }}
          V_IG_API_KEY:           ${{ secrets.IG_API_KEY }}
          V_IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          V_IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          V_IG_ACCOUNT_ID:        ${{ secrets.IG_ACCOUNT_ID }}
          V_SLACK_TRADES:         ${{ secrets.SLACK_TRADES }}
          V_SLACK_SIGNALS:        ${{ secrets.SLACK_SIGNALS }}
          V_SLACK_ALERTS:         ${{ secrets.SLACK_ALERTS }}
          V_SLACK_WEEKLY:         ${{ secrets.SLACK_WEEKLY }}
          V_SLACK_DAILY:          ${{ secrets.SLACK_DAILY }}
          V_QUIVER_QUANT_API_KEY: ${{ secrets.QUIVER_QUANT_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          keys = [
            ("SUPABASE_USER",        "V_SUPABASE_USER"),
            ("SUPABASE_DB_PASSWORD", "V_SUPABASE_DB_PASSWORD"),
            ("FRED_API_KEY",         "V_FRED_API_KEY"),
            ("EIA_API_KEY",          "V_EIA_API_KEY"),
            ("IG_API_KEY",           "V_IG_API_KEY"),
            ("IG_USERNAME",          "V_IG_USERNAME"),
            ("IG_PASSWORD",          "V_IG_PASSWORD"),
            ("IG_ACCOUNT_ID",        "V_IG_ACCOUNT_ID"),
            ("SLACK_TRADES",         "V_SLACK_TRADES"),
            ("SLACK_SIGNALS",        "V_SLACK_SIGNALS"),
            ("SLACK_ALERTS",         "V_SLACK_ALERTS"),
            ("SLACK_WEEKLY",         "V_SLACK_WEEKLY"),
            ("SLACK_DAILY",          "V_SLACK_DAILY"),
            ("QUIVER_QUANT_API_KEY", "V_QUIVER_QUANT_API_KEY"),
          ]
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], ".env")
          with open(path, "w") as f:
            for name, env_var in keys:
              f.write(f"{name}={os.environ.get(env_var, '')}\n")
          print(f"Written {len(keys)} lines to {path}")
          PYEOF
      - name: Verify and upload
        uses: actions/upload-artifact@v5
        with:
          name: env-file
          path: ${{ github.workspace }}/.env
          retention-days: 1
