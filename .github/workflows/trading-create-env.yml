name: Create .env file (download once)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-env:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write .env file
        run: |
          echo "SUPABASE_USER=${{ secrets.SUPABASE_USER }}"          >> .env
          echo "SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> .env
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}"            >> .env
          echo "EIA_API_KEY=${{ secrets.EIA_API_KEY }}"              >> .env
          echo "IG_API_KEY=${{ secrets.IG_API_KEY }}"                >> .env
          echo "IG_USERNAME=${{ secrets.IG_USERNAME }}"              >> .env
          echo "IG_PASSWORD=${{ secrets.IG_PASSWORD }}"              >> .env
          echo "IG_ACCOUNT_ID=${{ secrets.IG_ACCOUNT_ID }}"          >> .env
          echo "SLACK_TRADES=${{ secrets.SLACK_TRADES }}"            >> .env
          echo "SLACK_SIGNALS=${{ secrets.SLACK_SIGNALS }}"          >> .env
          echo "SLACK_ALERTS=${{ secrets.SLACK_ALERTS }}"            >> .env
          echo "SLACK_WEEKLY=${{ secrets.SLACK_WEEKLY }}"            >> .env
          echo "SLACK_DAILY=${{ secrets.SLACK_DAILY }}"              >> .env
          echo "QUIVER_QUANT_API_KEY=${{ secrets.QUIVER_QUANT_API_KEY }}" >> .env
          echo ".env written ($(wc -l < .env) lines)"
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: .env
          retention-days: 1
