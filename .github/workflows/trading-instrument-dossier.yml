name: Instrument Dossier (2026-10-21)

# One ticker in -> the full publication pack (HVF analysis, X tweet + post-card,
# Slack X-draft block, investment-case email), rendered via the production code
# paths. Because this runs in Actions WITH the real secrets, it also POSTS the
# tweet + card to #arw-claude-twitter (user 2026-06-15: "when the dossier runs
# also run the tweet process to the slack channel"). Local runs cannot post.
#
# workflow_dispatch only — triggered on demand (manually or via cron-job.org).
# No `schedule:` block (memory: feedback_scheduler — GitHub-native cron is BANNED).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker(s) to dossier, space-separated (e.g. RR.L NVDA)'
        required: true
        default: 'RR.L'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python instrument_dossier.py ${{ inputs.ticker }}
        env:
          SUPABASE_USER:            ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:     ${{ secrets.SUPABASE_DB_PASSWORD }}
          APP_SECRET_KEY:           ${{ secrets.APP_SECRET_KEY }}
          SLACK_TWITTER:            ${{ secrets.SLACK_TWITTER }}
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TWITTER_CHANNEL_ID: ${{ secrets.SLACK_TWITTER_CHANNEL_ID }}
          SLACK_ALERTS:             ${{ secrets.SLACK_ALERTS }}
      # The generated pack (summary/tweet/card/email) is kept on IONOS outside the web root,
      # /home/www/data/dossier/<run id>/ -- never a GitHub artifact (owner 2026-10-21: the repository is
      # PUBLIC and is for code, not reports).
      - name: Keep the dossier on IONOS
        if: always() && hashFiles('dossier/**') != ''
        env:
          IONOS_HOST:    ${{ secrets.IONOS_HOST }}
          IONOS_USER:    ${{ secrets.IONOS_USER }}
          IONOS_PORT:    ${{ secrets.IONOS_PORT || '22' }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ionos_key"; printf '%s\n' "$IONOS_SSH_KEY" > "$key"; chmod 600 "$key"
          dir=/home/www/data/dossier/${{ github.run_id }}
          tar -C dossier -cf - . | ssh -i "$key" -p "$IONOS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${IONOS_USER}@${IONOS_HOST}" "umask 077; mkdir -p $dir && tar -C $dir -xf - && ls -l $dir"
