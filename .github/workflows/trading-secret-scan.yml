name: Secret Scan (2026-10-21)

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0        # full history so all commits are scanned
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # not required for public repos
          # No report artifact (owner 2026-10-21: GitHub is not a place for output files). A leak still fails
          # the run and is listed in its log.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
