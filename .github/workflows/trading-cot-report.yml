name: Weekly COT Report (2026-06-07c)

# Scheduling: cron-job.org → workflow_dispatch ONLY. GitHub-native cron is BANNED
# (user directive — see memory/feedback_scheduler.md). Intended schedule:
# Sat 10:00 UTC, after the weekend review refreshes COT. Pending a working
# CRONJOB_API_KEY to (re)create the cron-job.org job; until then, manual dispatch.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_cot_report.py
        env:
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_WEEKLY:         ${{ secrets.SLACK_WEEKLY }}
          SLACK_ALERTS:         ${{ secrets.SLACK_ALERTS }}
