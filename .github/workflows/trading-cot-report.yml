name: Weekly COT Report (2026-06-07b)

# Scheduling: GitHub-native cron. The cron-job.org API key (CRONJOB_API_KEY) was
# generated by a prior Claude Code session and is NOT recoverable (not a repo
# secret; the user does not hold it), so new cron-job.org jobs cannot be created.
# This report is weekly + delay-tolerant and must run with the local machine off,
# so GitHub cron is appropriate here. Weekday time-critical sessions stay on the
# existing cron-job.org jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 6'   # Saturday 10:00 UTC — after the weekend review (09:00) refreshes COT

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_cot_report.py
        env:
          SUPABASE_USER:        ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_WEEKLY:         ${{ secrets.SLACK_WEEKLY }}
          SLACK_ALERTS:         ${{ secrets.SLACK_ALERTS }}
