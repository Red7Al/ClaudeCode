name: Setup Cron Jobs — reconcile / create / prune / status (2026-08-17)

# --reconcile (default): PATCHes ONLY each existing job's schedule.
#   Needs CRONJOB_API_KEY only. Use after changing cadence in setup_cronjobs.py.
# --create-missing: creates any JOBS entries not yet on cron-job.org.
#   Needs CRONJOB_API_KEY + GH_PAT (PAT is embedded in the new job's auth header).
#   Safe to re-run — skips existing jobs.
# --prune: deletes cron-job.org jobs no longer in JOBS, scoped to THIS repo's workflow
#   dispatches only. Needs CRONJOB_API_KEY only. Won't touch unrelated jobs.
# --repair: re-points and RE-ENABLES the named jobs (comma-separated in `titles`).
#   For jobs cron-job.org auto-disabled after delivery failures. Needs CRONJOB_API_KEY + GH_PAT.
#   Title-scoped on purpose: most OFF jobs on this account are off deliberately, and a blanket
#   re-enable would restart live trading automation. Never widen this to "all disabled jobs".
# --check-token: read-only. Asks GitHub whether GH_PAT can still see this repo's workflows.
#   Run this FIRST whenever GH_PAT has been rotated. --create-missing and --repair bake the PAT
#   into each job's Authorization header, so an expired one is written into every job they touch
#   and then fails silently at that job's next scheduled fire — which is what happened on
#   2026-08-16 (six jobs repaired with a PAT that had expired; all 401'd the next morning).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'reconcile = retune schedules | create-missing = add new | prune = delete removed | status = read-only diagnostic | check-token = is GH_PAT still valid?'
        required: false
        default: 'reconcile'
        type: choice
        options:
          - reconcile
          - create-missing
          - prune
          - status
          - repair
          - check-token
      titles:
        description: 'repair mode only: comma-separated job titles, e.g. "Data Quality Audit,HVF Orders"'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Reconcile schedules
        if: ${{ github.event.inputs.mode == 'reconcile' || github.event.inputs.mode == '' }}
        run: python setup_cronjobs.py --reconcile
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
      - name: Create missing jobs
        if: ${{ github.event.inputs.mode == 'create-missing' }}
        run: python setup_cronjobs.py --create-missing
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GH_PAT }}
      - name: Prune removed jobs
        if: ${{ github.event.inputs.mode == 'prune' }}
        run: python setup_cronjobs.py --prune
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
      - name: Job status diagnostic
        if: ${{ github.event.inputs.mode == 'status' }}
        run: python setup_cronjobs.py --status
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
      - name: Check GH_PAT is still valid
        if: ${{ github.event.inputs.mode == 'check-token' }}
        run: python setup_cronjobs.py --check-token
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Repair named jobs
        if: ${{ github.event.inputs.mode == 'repair' }}
        run: python setup_cronjobs.py --repair "${{ github.event.inputs.titles }}"
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GH_PAT }}
