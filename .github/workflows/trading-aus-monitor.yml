name: AUS/Asia Monitor

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 02:00 UTC Monday-Friday
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py AUS_MONITOR
        env:
          IG_API_KEY:            ${{ secrets.IG_API_KEY }}
          IG_USERNAME:           ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
          IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
          SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
          SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
          SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
