name: AUS/Asia Monitor (15 min)

on:
  schedule:
    - cron: '*/30 0-3 * * 1-5'   # Every 30 min, 00:00-03:59 UTC (AUS/Asia — commodities 24/5)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_API_KEY:            ${{ secrets.IG_API_KEY }}
      IG_USERNAME:           ${{ secrets.IG_USERNAME }}
      IG_PASSWORD:           ${{ secrets.IG_PASSWORD }}
      IG_ACCOUNT_ID:         ${{ secrets.IG_ACCOUNT_ID }}
      SUPABASE_USER:         ${{ secrets.SUPABASE_USER }}
      SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
      SLACK_TRADES:          ${{ secrets.SLACK_TRADES }}
      SLACK_ALERTS:          ${{ secrets.SLACK_ALERTS }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python run_session.py AUS_MONITOR
