[pytest]
python_files = test_*.py
testpaths = .
addopts = --strict-markers
markers =
    live_state: needs live runtime state a clean checkout has no access to - the Supabase user
        store, or a built hvf_web/snapshot.json. Deselected by the offline CI job
        (trading-hvf-tests.yml) with -m "not live_state"; runs normally on a configured machine.
