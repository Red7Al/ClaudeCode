<!DOCTYPE html>
<!-- HVF website UI (user 2026-06-27). Single file. v1.2.0 -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squeeze Scanner</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --fg:#c9d1d9; --muted:#8b949e; --line:#30363d;
  --accent:#58a6ff; --bull:#3fb950; --bear:#f85149; --chip:#21262d;
}
:root.light{
  --bg:#f6f8fa; --panel:#ffffff; --fg:#24292f; --muted:#57606a; --line:#d0d7de;
  --accent:#0969da; --bull:#1a7f37; --bear:#cf222e; --chip:#eaeef2;
}
*{box-sizing:border-box} body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0} .grow{flex:1}
.btn{background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.layout{display:flex;gap:0;min-height:calc(100vh - 49px)}
aside{width:270px;flex:none;border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 49px);position:sticky;top:49px}
aside h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
.f{margin-bottom:8px} label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
select,input{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px}
.row2{display:flex;gap:6px} .row2 input{width:50%}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.count{padding:8px 16px;color:var(--muted);font-size:12px}
.viz{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.vizsector{flex:none}
.vizbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;min-width:0;align-items:start}
.vizbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.vizbox h5{margin:0 0 6px;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.bars{display:flex;flex-direction:column;gap:3px;min-width:150px}
.bar{display:flex;align-items:center;gap:6px;font-size:11px}
.bar .tk{width:62px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .fill{height:11px;border-radius:2px;background:var(--accent)}
.bar .n{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;color:var(--muted);font-size:11px;text-transform:uppercase}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--chip)} tr.sel{background:var(--chip)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
.bull{background:rgba(63,185,80,.15);color:var(--bull)} .bear{background:rgba(248,81,73,.15);color:var(--bear)}
.muted{color:var(--muted);font-size:11px}
.tablewrap{overflow:auto;flex:1}
#detail{width:560px;flex:none;border-left:1px solid var(--line);padding:14px;overflow:auto;max-height:calc(100vh - 49px);position:sticky;top:49px}
#detail.hidden{display:none}
#detail h2{margin:0 0 2px;font-size:18px} .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
.card h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--muted)}
img{max-width:100%;border-radius:6px;display:block}
.rule{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.rule .top{display:flex;gap:8px;align-items:center}
.rule .why{color:var(--muted);font-size:12px;margin-top:3px;white-space:pre-wrap}
.v{font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px}
.PASS{background:rgba(63,185,80,.15);color:var(--bull)} .FAIL{background:rgba(248,81,73,.15);color:var(--bear)}
.DEVELOPING{background:rgba(210,153,34,.18);color:#d29922}
.tweet{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:8px}
.kv{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0;font-size:13px}
.slider{display:flex;align-items:center;gap:8px} .slider input{flex:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
a{color:var(--accent)}
.clk{cursor:pointer} .clk:hover{opacity:.75}
aside.collapsed{display:none}
.vizbox.filtered{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.afilt{color:var(--accent);font-size:10px;font-weight:700;cursor:pointer}
.bar.active .tk{color:var(--fg);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Squeeze Scanner</h1>
  <span class="count" id="gen"></span>
  <span class="grow"></span>
  <button class="btn" id="signalonly">Squeeze only ✓</button>
  <button class="btn" id="refresh">↻ Refresh data</button>
  <button class="btn" id="togglefilters">☰ Filters (Toggle)</button>
  <button class="btn" id="reset">Reset filters</button>
  <button class="btn" id="showall">Remove all filters (show all)</button>
  <button class="btn" id="theme">🌙 Dark</button>
</header>
<div class="layout">
  <aside id="aside">
    <h3>Direction & place</h3>
    <div class="f"><label>Direction</label><select id="f_dir"><option value="">Any</option><option>BULL</option><option>BEAR</option><option value="—">— (none)</option></select></div>
    <div class="f"><label>Location (Geography)</label><select id="f_loc"><option value="">Any</option></select></div>
    <div class="f"><label>Market</label><select id="f_mkt"><option value="">Any</option></select></div>
    <div class="f"><label>Sector</label><select id="f_sec"><option value="">Any</option></select></div>
    <h3>Squeeze</h3>
    <div class="f"><label>Status</label><select id="f_stat"><option value="">Any</option><option>TRIGGERED</option><option>READY</option><option>DEVELOPING</option><option value="—">— (none)</option></select></div>
    <div class="f"><label>Timeframe</label><select id="f_tf"><option value="">Any</option></select></div>
    <div class="f"><label>Quality range</label><div class="row2"><input id="f_qmin" type="number" value="45" placeholder="min"><input id="f_qmax" type="number" placeholder="max"></div></div>
    <div class="f"><label>R:R range</label><div class="row2"><input id="f_rrmin" type="number" step="0.1" placeholder="min"><input id="f_rrmax" type="number" step="0.1" placeholder="max"></div></div>
    <div class="f"><label>Dist to entry % range</label><div class="row2"><input id="f_demin" type="number" step="0.1" value="-10" placeholder="min"><input id="f_demax" type="number" step="0.1" value="10" placeholder="max"></div></div>
    <div class="f"><label>Days since setup range</label><div class="row2"><input id="f_dsmin" type="number" placeholder="min"><input id="f_dsmax" type="number" placeholder="max"></div></div>
    <h3>Fundamentals</h3>
    <div class="f"><label>P/E range</label><div class="row2"><input id="f_pemin" type="number" placeholder="min"><input id="f_pemax" type="number" placeholder="max"></div></div>
    <div class="f"><label>Insider % range</label><div class="row2"><input id="f_inmin" type="number" step="0.1" placeholder="min"><input id="f_inmax" type="number" step="0.1" placeholder="max"></div></div>
    <h3>Chart window</h3>
    <div class="f"><label>Price chart: last <span id="dlbl">365</span> days</label>
      <div class="slider"><input id="f_days" type="range" min="30" max="1095" step="5" value="365"></div></div>
    <small class="muted">Drives the "Price — last N days" chart only.</small>
  </aside>

  <main>
    <div class="viz" id="viz"></div>
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="ticker">Ticker</th><th data-k="name">Name</th><th data-k="direction">Dir</th>
          <th data-k="days_since" title="Days since the setup's 3rd swing (H3) formed">Days since</th>
          <th data-k="sector">Sector</th><th data-k="status">Status</th><th data-k="x_posts" title="Number of X posts we've published for this instrument">X posts</th>
          <th data-k="trig_date">Triggered</th><th data-k="quality">Quality</th><th data-k="rr">R:R</th>
          <th data-k="dist_entry">Dist→Entry</th>
          <th data-k="pe">P/E</th><th data-k="timeframe">TF</th>
          <th data-k="market">Market</th><th data-k="location">Location</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <section id="detail" class="hidden"></section>
</div>

<script>
let DATA=[], SEL=null, sortK="trig_date", sortDir=-1, POS={}, PUB={}, signalOnly=true;
const $=id=>document.getElementById(id);
const F=["f_dir","f_loc","f_mkt","f_sec","f_stat","f_tf","f_qmin","f_qmax","f_rrmin","f_rrmax",
         "f_demin","f_demax","f_dsmin","f_dsmax","f_pemin","f_pemax","f_inmin","f_inmax"];
const LOC={UK:"United Kingdom",US:"United States",FX:"FX / Indices"};
const locName=v=>LOC[v]||v||"";
const f2=v=>(v==null||v==="")?"":(+v).toFixed(2);
const disp=t=>(t||"").replace(/\.L$/,"");
const qcol=q=>q>=70?"var(--bull)":q>=50?"#d29922":"var(--bear)";   // quality colour: green / amber / red

function uniq(k){return [...new Set(DATA.map(r=>r[k]).filter(x=>x!=null))].sort();}
function fillSel(id,k,label){const s=$(id);uniq(k).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=label?label(v):v;s.appendChild(o);});
  if(DATA.some(r=>!r[k])){const o=document.createElement("option");o.value="—";o.textContent="— (none)";s.appendChild(o);}}
const num=v=>v===""||v==null?null:parseFloat(v);
function daysSince(d){if(!d)return null;const t=Date.parse(d);if(isNaN(t))return null;return Math.round((Date.now()-t)/864e5);}

function augment(r){
  r.dist_entry=(r.entry!=null&&r.current_price)? +(((r.entry-r.current_price)/r.current_price)*100).toFixed(2):null;
  r.days_since=daysSince(r.h3_date);
  r.trig_date=(r.status==="TRIGGERED")?((r.direction==="BULL"?r.l3_date:r.h3_date)||r.l3_date||r.h3_date):null;
  r.open_pos=POS[r.ticker]??POS[disp(r.ticker)]??0;
  r.x_posts=PUB[r.ticker]??PUB[disp(r.ticker)]??0;
}

function pass(r){
  if(signalOnly && r.has_signal===false)return false;
  const g=id=>$(id).value;
  // "—" is the missing-value bucket from the charts (no-signal rows have null direction/status/etc.):
  // selecting it filters to rows where that field is empty (user 2026-06-28).
  const sel=(v,id)=>{const f=g(id);return !f || (f==="—" ? !v : v===f);};
  if(!sel(r.direction,"f_dir"))return false;
  if(!sel(r.location,"f_loc"))return false;
  if(!sel(r.market,"f_mkt"))return false;
  if(!sel(r.sector,"f_sec"))return false;
  if(!sel(r.status,"f_stat"))return false;
  if(!sel(r.timeframe,"f_tf"))return false;
  // null value passes a range (a no-signal / missing-field row is never excluded by a numeric range —
  // so toggling "Squeeze only" off shows the whole monitored universe).
  const rng=(v,lo,hi)=>{const a=num(g(lo)),b=num(g(hi));if(v==null)return true;if(a!=null&&v<a)return false;if(b!=null&&v>b)return false;return true;};
  if(!rng(r.quality,"f_qmin","f_qmax"))return false;
  if(!rng(r.rr,"f_rrmin","f_rrmax"))return false;
  if(!rng(r.dist_entry,"f_demin","f_demax"))return false;
  if(!rng(r.days_since,"f_dsmin","f_dsmax"))return false;
  if(!rng(r.pe,"f_pemin","f_pemax"))return false;
  if(!rng(r.insider_pct,"f_inmin","f_inmax"))return false;
  return true;
}

function barChart(title,counts,fk,colorFn){
  const active=($(fk)||{}).value||"";
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=Math.max(1,...entries.map(e=>e[1]));
  const rows=entries.map(([k,n])=>{const on=active&&String(k)===active;
    return `<div class="bar clk${on?' active':''}" data-fk="${fk}" data-fv="${k}" title="click to filter ${k}"><span class="tk">${on?'● ':''}${k}</span>
    <span class="fill" style="width:${Math.round(n/max*90)}px;background:${colorFn?colorFn(k):'var(--accent)'};opacity:${active&&!on?0.4:1}"></span><span class="n">${n}</span></div>`;}).join("");
  return `<div class="vizbox${active?' filtered':''}"><h5>${title}${active?` <span class="afilt clk" data-fk="${fk}" data-fv="" title="clear filter">▶ ${active} ✕</span>`:''}</h5><div class="bars">${rows}</div></div>`;
}
function pieChart(title,counts,fk){
  const active=($(fk)||{}).value||"";
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0)||1;
  const cols=["#58a6ff","#3fb950","#f85149","#d29922","#a371f7","#db61a2","#e3b341","#79c0ff","#56d364","#ff7b72"];
  let a=0,seg="";
  entries.forEach(([k,n],i)=>{const frac=n/total,a2=a+frac*2*Math.PI;const on=active&&String(k)===active;
    const x1=20+18*Math.cos(a-Math.PI/2),y1=20+18*Math.sin(a-Math.PI/2);
    const x2=20+18*Math.cos(a2-Math.PI/2),y2=20+18*Math.sin(a2-Math.PI/2);
    seg+=`<path class="clk" data-fk="${fk}" data-fv="${k}" d="M20,20 L${x1.toFixed(2)},${y1.toFixed(2)} A18,18 0 ${frac>0.5?1:0},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${cols[i%cols.length]}" stroke="${on?'var(--fg)':'none'}" stroke-width="${on?1.5:0}" opacity="${active&&!on?0.4:1}"><title>click to filter ${k}</title></path>`;a=a2;});
  const legend=entries.slice(0,8).map(([k,n],i)=>{const on=active&&String(k)===active;
    return `<div class="bar clk${on?' active':''}" data-fk="${fk}" data-fv="${k}"><span class="fill" style="width:10px;background:${cols[i%cols.length]}"></span><span class="tk" style="text-align:left;width:auto" title="click to filter ${k}">${on?'● ':''}${k} (${n})</span></div>`;}).join("");
  return `<div class="vizbox${active?' filtered':''}"><h5>${title}${active?` <span class="afilt clk" data-fk="${fk}" data-fv="" title="clear filter">▶ ${active} ✕</span>`:''}</h5><div style="display:flex;gap:8px;align-items:center">
    <svg viewBox="0 0 40 40" width="86" height="86">${seg}</svg><div class="bars" style="min-width:120px">${legend}</div></div></div>`;
}
function renderViz(rows){
  const by=k=>rows.reduce((m,r)=>{const v=r[k]||"—";m[v]=(m[v]||0)+1;return m;},{});
  // Bars wrap among themselves in the top row; the Sector pie gets its own row so nothing ever
  // stacks directly above or below it (user 2026-06-28).
  // Sector pie is its OWN left column; the bar charts wrap among themselves to the right — so the
  // sector chart never sits below (or above) another chart (user 2026-06-28).
  $("viz").innerHTML=
    `<div class="vizsector">`+pieChart("Sector",by("sector"),"f_sec")+`</div>`+
    `<div class="vizbars">`+
      barChart("Direction",by("direction"),"f_dir",k=>k==="BULL"?"var(--bull)":"var(--bear)")+
      barChart("Status",by("status"),"f_stat",k=>k==="TRIGGERED"?"var(--bull)":k==="READY"?"var(--accent)":"#d29922")+
      barChart("Market",by("market"),"f_mkt")+
      barChart("Timeframe",by("timeframe"),"f_tf")+
    `</div>`;
}

function render(){
  const rows=DATA.filter(pass).sort((a,b)=>{
    const x=a[sortK],y=b[sortK];const av=x==null?-1e9:x,bv=y==null?-1e9:y;
    return (av<bv?-1:av>bv?1:0)*sortDir;});
  $("count").innerHTML=`<b style="font-size:15px;color:var(--fg)">${rows.length}</b> instruments visible <span class="muted">of ${DATA.length} total</span>`;
  renderViz(rows);
  $("rows").innerHTML=rows.map(r=>`<tr data-t="${r.ticker}" class="${SEL===r.ticker?'sel':''}">
    <td><b>${disp(r.ticker)}</b></td><td>${r.name||''}</td>
    <td><span class="tag ${r.direction==='BULL'?'bull':'bear'}">${r.direction}</span></td>
    <td>${r.days_since??''}</td>
    <td>${r.sector||''}</td><td>${r.status||''}</td><td>${r.x_posts?`<b>${r.x_posts}</b>`:''}</td>
    <td>${r.trig_date?r.trig_date.slice(0,10):''}</td>
    <td>${r.quality!=null?`<b style="color:${qcol(r.quality)}">${r.quality}</b>`:''}</td><td>${r.rr!=null?r.rr.toFixed(1):''}</td>
    <td>${r.dist_entry!=null?(r.dist_entry>0?'+':'')+r.dist_entry+'%':''}</td>
    <td>${r.pe??''}</td><td>${(r.timeframe||'').replace('daily-','D')}</td><td>${r.market||''}</td><td>${locName(r.location)}</td></tr>`).join("")
    || `<tr><td colspan="15" class="empty">No setups match the filters.</td></tr>`;
  document.querySelectorAll("#rows tr[data-t]").forEach(tr=>tr.onclick=()=>{tr.dataset.t===SEL?closeDetail():showDetail(tr.dataset.t);});
}

function closeDetail(){SEL=null;$("detail").classList.add("hidden");render();}

function showDetail(t){
  SEL=t; render();
  const r=DATA.find(x=>x.ticker===t); if(!r){return;}
  const days=+$("f_days").value;
  let broker="<span class='muted'>no broker data</span>";
  if(r.broker){const b=r.broker;let tr="";
    if(b.trend&&b.trend.length===3){tr=` · buys ${b.trend[0]}→${b.trend[1]} (${b.trend[1]>b.trend[0]?'strengthening':'cooling'}) over ~3mo`;}
    broker=`${b.buys??'?'} Buy / ${b.holds??'?'} Hold of ${b.rated??'?'} rated${tr}`;}
  $("detail").classList.remove("hidden");
  $("detail").innerHTML=`
    <button class="btn" onclick="closeDetail()" style="float:right">✕ Close (back to list)</button>
    <h2>${disp(r.ticker)} <span class="muted" style="font-size:13px">${r.name||''}</span> <span class="tag ${r.direction==='BULL'?'bull':'bear'}">${r.direction}</span></h2>
    <div class="sub">${locName(r.location)} · ${r.market||''} · ${r.sector||''} · ${r.status} · Q${r.quality??'?'} · R:R ${r.rr!=null?r.rr.toFixed(2):'?'} · ${(r.timeframe||'').replace('daily-','D')}</div>
    <div class="card"><h4>Squeeze Rules 1–5 — justification</h4><div id="rulesbox">loading…</div></div>
    <div class="card"><h4>Quality (${r.quality??'?'}/100) — how it's scored</h4>
      <div class="muted" style="font-size:12px">Q combines three things: <b>tightness</b> (how compressed the funnel is vs its first amplitude — up to 50 pts, tighter = higher), <b>freshness</b> (how recently the 3rd high formed — up to 30 pts, more recent = higher), and <b>symmetry</b> (how evenly the swings are spaced — up to 20 pts). 100 = a very tight, fresh, symmetric funnel; a low Q means a loose, older, or lopsided one.</div></div>
    <div class="card"><h4>Fundamentals — key metrics</h4><div id="fundbox">loading…</div></div>
    <div class="card"><h4>Price — last ${days} days (filter-reactive)</h4>
      <img id="pw" src="/api/pricewin/${r.ticker}?days=${days}&theme=${document.documentElement.classList.contains('light')?'light':'dark'}"></div>
    <div class="card"><h4>X post card</h4><img loading="lazy" src="/api/card/${r.ticker}"></div>
    <div class="card"><h4>Levels</h4>
      <div class="kv"><span>Now</span><b>${f2(r.current_price)}</b></div>
      <div class="kv"><span>Entry</span><b>${f2(r.entry)}</b></div>
      <div class="kv"><span>Stop</span><b>${f2(r.stop)}</b></div>
      <div class="kv"><span>Target</span><b>${f2(r.target)}</b></div>
      <div class="kv"><span>Dist to entry</span><b>${r.dist_entry!=null?(r.dist_entry>0?'+':'')+r.dist_entry+'%':'?'}</b></div>
      <div class="kv"><span>P/E</span><b>${r.pe??'?'}</b></div>
      <div class="kv"><span>Insider %</span><b>${r.insider_pct!=null?r.insider_pct.toFixed(2)+'%':'?'}</b></div></div>
    <div class="card"><h4>Broker analysis</h4>${broker}<div id="brokerchg" class="muted" style="margin-top:6px">loading 6–12mo change…</div></div>
    <div class="card"><h4>On X</h4><div id="xlinks">loading…</div></div>
    <div class="card"><h4>X thread (all pages)</h4><div class="tweet" id="tweetbox">loading…</div></div>`;
  fetch(`/api/thread/${r.ticker}`).then(x=>x.json()).then(j=>{
    const el=document.getElementById("tweetbox"); if(!el||SEL!==r.ticker)return;
    const parts=j.parts||[]; if(!parts.length){el.textContent="(no thread — not a publishable setup)";return;}
    el.innerHTML=parts.map((p,i)=>`<div style="padding:6px 0;border-top:${i?'1px solid var(--line)':'none'}">${(p||'').replace(/</g,'&lt;').replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}</div>`).join("");
  }).catch(()=>{});
  fetch(`/api/fundamentals/${r.ticker}`).then(x=>x.json()).then(j=>{
    const el=document.getElementById("fundbox"); if(!el||SEL!==r.ticker)return;
    const k=j.kpis||{}, sym=({GBp:"£",GBP:"£",USD:"$",EUR:"€"})[j.currency]||"";
    const money=v=>{if(v==null)return null;const a=Math.abs(v),s=v<0?"-":"";
      return a>=1e9?`${s}${sym}${(a/1e9).toFixed(2)}bn`:a>=1e6?`${s}${sym}${(a/1e6).toFixed(1)}m`:a>=1e3?`${s}${sym}${(a/1e3).toFixed(0)}k`:`${s}${sym}${a.toFixed(0)}`;};
    const pct=v=>v==null?null:(v*100).toFixed(1)+"%", rat=v=>v==null?null:(+v).toFixed(2), cash=v=>v==null?null:sym+rat(v);
    // Colour-code anything concerning/bad (user 2026-06-28): red = poor, amber = watch, green = strong.
    const C={r:"var(--bear)",a:"#d29922",g:"var(--bull)"};
    const grade={
      trailingPE:v=>v<0?'r':v>80?'r':v>40?'a':null, forwardPE:v=>v<0?'r':v>80?'r':v>40?'a':null,
      pegRatio:v=>v<0?'a':v>3?'r':v>2?'a':(v>0&&v<1?'g':null),
      priceToBook:v=>v<0?'r':v>10?'a':null, priceToSales:v=>v>20?'a':null, evToEbitda:v=>v<0?'r':v>20?'a':null,
      trailingEps:v=>v<0?'r':null, forwardEps:v=>v<0?'a':null,
      dividendYield:v=>v>0.10?'a':null, payoutRatio:v=>v<0?'a':v>1?'r':v>0.8?'a':null,
      freeCashflow:v=>v<0?'r':null, operatingCashflow:v=>v<0?'a':null,
      grossMargin:v=>v<0?'r':null, operatingMargin:v=>v<0?'r':v<0.05?'a':v>0.2?'g':null, profitMargin:v=>v<0?'r':v<0.05?'a':v>0.2?'g':null,
      roe:v=>v<0?'r':v>0.15?'g':null, roa:v=>v<0?'a':null,
      revenueGrowth:v=>v<-0.10?'r':v<0?'a':v>0.10?'g':null, earningsGrowth:v=>v<-0.20?'r':v<0?'a':v>0.15?'g':null,
      debtToEquity:v=>v>200?'r':v>100?'a':null, currentRatio:v=>v<1?'r':v<1.5?'a':v>2?'g':null, quickRatio:v=>v<1?'a':null,
      beta:v=>v>2?'a':null,
    };
    const col=key=>{if(!key||k[key]==null||!grade[key])return"var(--fg)";const g=grade[key](k[key]);return g?C[g]:"var(--fg)";};
    const rows=[
      ["Market cap",money(k.marketCap)],["Revenue (ttm)",money(k.totalRevenue)],["EBITDA",money(k.ebitda)],
      ["P/E (trailing)",rat(k.trailingPE),"trailingPE"],["P/E (forward)",rat(k.forwardPE),"forwardPE"],["PEG",rat(k.pegRatio),"pegRatio"],
      ["Price / Book",rat(k.priceToBook),"priceToBook"],["Price / Sales",rat(k.priceToSales),"priceToSales"],["EV / EBITDA",rat(k.evToEbitda),"evToEbitda"],
      ["EPS (ttm)",cash(k.trailingEps),"trailingEps"],["EPS (forward)",cash(k.forwardEps),"forwardEps"],
      ["Dividend yield",pct(k.dividendYield),"dividendYield"],["Dividend / share",cash(k.dividendRate)],["Payout ratio",pct(k.payoutRatio),"payoutRatio"],
      ["Free cash flow",money(k.freeCashflow),"freeCashflow"],["Operating cash flow",money(k.operatingCashflow),"operatingCashflow"],
      ["Gross margin",pct(k.grossMargin),"grossMargin"],["Operating margin",pct(k.operatingMargin),"operatingMargin"],["Profit margin",pct(k.profitMargin),"profitMargin"],
      ["Return on equity",pct(k.roe),"roe"],["Return on assets",pct(k.roa),"roa"],
      ["Revenue growth",pct(k.revenueGrowth),"revenueGrowth"],["Earnings growth",pct(k.earningsGrowth),"earningsGrowth"],
      ["Debt / Equity",rat(k.debtToEquity),"debtToEquity"],["Current ratio",rat(k.currentRatio),"currentRatio"],["Quick ratio",rat(k.quickRatio),"quickRatio"],
      ["Beta",rat(k.beta),"beta"],
      ["52-week range",(k.fiftyTwoWeekLow!=null&&k.fiftyTwoWeekHigh!=null)?`${sym}${rat(k.fiftyTwoWeekLow)} – ${sym}${rat(k.fiftyTwoWeekHigh)}`:null],
    ].filter(x=>x[1]!=null);
    el.innerHTML=rows.length?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">`+
      rows.map(([lab,val,key])=>`<div class="kv"><span>${lab}</span><b style="color:${col(key)}">${val}</b></div>`).join("")+`</div>`
      +`<div class="muted" style="font-size:11px;margin-top:6px"><span style="color:var(--bear)">red</span> = poor · <span style="color:#d29922">amber</span> = watch · <span style="color:var(--bull)">green</span> = strong</div>`
      :"no fundamentals available (often the case for funds / indices)";
  }).catch(()=>{const el=document.getElementById("fundbox");if(el)el.textContent="fundamentals unavailable";});
  fetch(`/api/broker/${r.ticker}`).then(x=>x.json()).then(j=>{
    const el=document.getElementById("brokerchg"); if(!el||SEL!==r.ticker)return;
    if(!j.available){el.textContent="6–12mo change: no analyst upgrade/downgrade history";return;}
    const net=(u,d)=>`${u-d>=0?'+':''}${u-d} net (${u}↑ / ${d}↓)`;
    el.innerHTML=`Coverage change — 0–6 mo: <b>${net(j.up6,j.down6)}</b> · 0–12 mo: <b>${net(j.up12,j.down12)}</b>`;
  }).catch(()=>{const el=document.getElementById("brokerchg");if(el)el.textContent="6–12mo change unavailable";});
  fetch(`/api/rules/${r.ticker}`).then(x=>x.json()).then(j=>{
    const el=document.getElementById("rulesbox"); if(!el||SEL!==r.ticker)return;
    el.innerHTML=(j.rules||[]).map(u=>`<div class="rule"><div class="top"><span class="v ${u.verdict}">${u.verdict}</span><b>Rule ${u.n} — ${u.name}</b></div><div class="why">${(u.detail||u.note||'').replace(/</g,'&lt;')}</div></div>`).join("")
      || "<span class='muted'>no rule detail</span>";
  }).catch(()=>{document.getElementById("rulesbox")&&(document.getElementById("rulesbox").textContent="rules unavailable");});
  fetch(`/api/links/${r.ticker}`).then(x=>x.json()).then(j=>{
    const el=document.getElementById("xlinks"); if(!el||SEL!==r.ticker)return;
    let h="";
    if(j.ours) h+=`<div class="kv"><span>Our latest post</span><a href="${j.ours.url}" target="_blank" rel="noopener">view on X →</a></div>`;
    else h+=`<div class="kv"><span>Our latest post</span><span class="muted">not yet published</span></div>`;
    if(j.mentions&&j.mentions.length){
      h+=`<div class="muted" style="margin-top:6px">Tracked accounts on $${disp(r.ticker)}:</div>`;
      h+=j.mentions.map(m=>`<div class="kv"><a href="${m.url}" target="_blank" rel="noopener">@${(m.account||'').replace(/^@/,'')}</a><span class="muted">${m.date?m.date.slice(0,10):''}</span></div>`).join("");
    } else { h+=`<div class="muted" style="margin-top:4px">No tracked-account mentions.</div>`; }
    el.innerHTML=h;
  }).catch(()=>{});
}

function applyAll(){render(); if(SEL&&!$("detail").classList.contains("hidden")){const r=DATA.find(x=>x.ticker===SEL);if(r&&pass(r))showDetail(SEL);else{$("detail").classList.add("hidden");SEL=null;}}}

document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortDir=(sortK===k)?-sortDir:-1;sortK=k;render();});
F.forEach(id=>$(id).addEventListener("input",applyAll));
// Click a chart bar / pie slice to set that filter (toggle off if already set) — user 2026-06-27.
$("viz").addEventListener("click",e=>{const el=e.target.closest("[data-fk]");if(!el)return;
  const f=$(el.dataset.fk); if(!f)return; f.value=(f.value===el.dataset.fv)?"":el.dataset.fv; applyAll();});
$("f_days").addEventListener("input",()=>{$("dlbl").textContent=$("f_days").value; if(SEL){const img=$("pw"); if(img) img.src=`/api/pricewin/${SEL}?days=${$("f_days").value}&theme=${document.documentElement.classList.contains('light')?'light':'dark'}`;}});
$("reset").onclick=()=>{F.forEach(id=>{$(id).value="";});$("f_qmin").value=45;$("f_demin").value=-10;$("f_demax").value=10;$("f_days").value=365;$("dlbl").textContent=365;applyAll();};
$("showall").onclick=()=>{F.forEach(id=>{$(id).value="";});signalOnly=false;$("signalonly").textContent="Squeeze only ✗";$("f_days").value=365;$("dlbl").textContent=365;applyAll();};
$("togglefilters").onclick=()=>$("aside").classList.toggle("collapsed");
$("signalonly").onclick=()=>{signalOnly=!signalOnly;$("signalonly").textContent="Squeeze only "+(signalOnly?"✓":"✗");applyAll();};
$("refresh").onclick=()=>{ if(!confirm("Rebuild the snapshot now? Scans ~400 instruments — takes a few minutes. The page keeps working with current data; reload when done."))return;
  $("refresh").textContent="↻ Refreshing…";
  fetch("/api/refresh",{method:"POST"}).then(x=>x.json()).then(j=>{$("refresh").textContent=j.busy?"↻ Already refreshing…":"↻ Refreshing… reload in ~5 min";})
    .catch(()=>$("refresh").textContent="↻ Refresh failed");};
$("theme").onclick=()=>{const l=document.documentElement.classList.toggle("light");$("theme").textContent=l?"☀️ Light":"🌙 Dark";if(SEL)showDetail(SEL);};

Promise.all([fetch("/api/records").then(r=>r.json()),
             fetch("/api/positions").then(r=>r.json()).catch(()=>({positions:{}})),
             fetch("/api/pubcounts").then(r=>r.json()).catch(()=>({pubcounts:{}}))])
  .then(([j,p,pc])=>{
    POS=p.positions||{}; PUB=pc.pubcounts||{};
    DATA=j.records||[]; DATA.forEach(augment);
    $("gen").textContent=j.generated_utc?("snapshot "+new Date(j.generated_utc).toLocaleString()):"no snapshot — run build_snapshot.py";
    fillSel("f_loc","location",locName);fillSel("f_mkt","market");fillSel("f_sec","sector");fillSel("f_tf","timeframe");
    render();
  });
</script>
</body>
</html>
