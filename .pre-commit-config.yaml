repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        description: Scan staged files for secrets before committing
        entry: gitleaks protect --staged --redact --config .gitleaks.toml
        language: golang
        pass_filenames: false
  - repo: local
    hooks:
      - id: hvf-regression-quick
        name: HVF regression suite (quick, offline)
        description: Detection-code commits cannot land without the synthetic suite green (2026-06-12)
        entry: python test_hvf_method.py --quick
        language: system
        files: ^(price_action|config|test_hvf_method)\.py$
        pass_filenames: false
      # Client JavaScript must PARSE before it can be committed (2026-09-04).
      #
      # WHY. A comment containing backticks was written inside a template literal in hvf_web/app.js. The
      # backticks closed the literal, the file stopped parsing, and the whole client died -- no tab on the
      # site responded. It was committed and deployed with 692 tests green, because nothing in the suite
      # parses app.js: test_performance_inline_javascript_parses only checks <script> blocks inside
      # index.html, and every other check reads the file as text or extracts one function from it.
      #
      # node --check is the whole fix and it takes milliseconds. This hook is the gate that makes the
      # mistake impossible to commit rather than merely unlikely; test_every_client_javascript_file_parses
      # covers the same ground for anyone running the suite, and deploy_ionos.sh re-checks the built
      # package so a bypassed hook still cannot reach the host.
      - id: client-js-parses
        name: Client JavaScript parses (node --check)
        description: A syntax error in app.js takes the entire site down; it must not be committable
        entry: node --check
        language: system
        files: ^hvf_web/.*\.js$
      # Save buttons must report their own outcome, in their own place (2026-09-26).
      #
      # WHY. The owner reported that a failed save showed as a failure on OTHER, unrelated save buttons.
      # It was five defects of one shape: three handlers sharing #cfg-msg (one of them from a different
      # panel entirely), #cfg-msg2 sitting in the page with zero references, #lim-msg2 targeted but
      # deleted along with the card that owned it, and clearFilterDefaults reporting nothing at all.
      #
      # NONE OF IT WAS VISIBLE BY READING EITHER FILE. The wiring is string ids in app.js pointing at
      # elements in index.html; only cross-checking the two finds a mismatch, and nothing did. saveStatus
      # makes silence the default failure mode -- it drops missing targets with .filter(Boolean) -- so a
      # dangling id is not an error, it is a save that quietly says nothing.
      #
      # Same three layers as the hook above: this gate makes it uncommittable, the test file covers anyone
      # running the suite, and CI runs it on every push.
      - id: save-status-wiring
        name: Save buttons report independently (status-element wiring)
        description: One save failing must never appear as another save failing
        # THE VENV, EXPLICITLY. The bare `python` here is a system 3.14 with no pytest, so
        # `python -m pytest` fails with "No module named pytest" -- which is exactly how this hook
        # failed on its first real commit. CLAUDE.md records the same trap as trap 1 of running the
        # tests; language: system means pre-commit does not build an environment of its own.
        entry: ./.venv/Scripts/python.exe -m pytest test_save_status_wiring.py -q
        language: system
        files: ^(hvf_web/(app\.js|index\.html)|test_save_status_wiring\.py)$
        pass_filenames: false
